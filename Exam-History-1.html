                const oscillator = audioCtx.createOscillator();

                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);

                 "(C) 錯誤。雖然陪葬品的差異能反映階級制度，但題幹強調的是「外來品特展」，核心意義在於對外的貿易交流。", 
                 "(D) 錯誤。磨製石器是新石器時代的特徵，且與玻璃、青銅等金屬貿易品無關。十三行主要特徵是煉鐵。"], 
                "只要在台灣的考古遺址中看到「玻璃、瑪瑙、中國銅錢、青銅器」等非本土產物，第一時間就要聯想到「海外貿易」。");
            
            addQ("<img src=\"Exam-History-1/p4.jpg\" alt=\"第4題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">附表是小惠將兩個臺灣史前文化整理的資料(大坌坑與圓山文化)。根據內容判斷,這兩個文化擁有哪一項共同點?", 
                ["已有煉鐵技術", "已知使用文字", "開始飼養家畜", "僅會打製石器"], 
                2, 
                ["(A) 錯誤。煉鐵技術是金屬器時代(十三行文化)才出現的特徵。", 
                 "(B) 錯誤。大坌坑與圓山文化皆屬於史前時代，尚未出現文字。", 
                 "(C) 正確。大坌坑文化(新石器早期)與圓山文化(新石器晚期)都屬於「新石器時代」。新石器時代的重大突破就是農業的發展與「開始飼養家畜」，過著定居生活。", 
                 "(D) 錯誤。僅會打製石器是舊石器時代(長濱文化)的特徵，新石器時代已經會使用「磨製石器」。"], 
                "解題關鍵：辨識出大坌坑與圓山皆為「新石器時代」。新石器時代的三大指標：磨製石器、燒製陶器、農業與畜牧。");
            
            addQ("幾年前,儲放在蘭嶼的核廢料曾引起當地原住民的不滿,並要求政府盡速將核廢料運走。居住在當地的原住民屬於下列哪一族?", 
                ["阿美族", "排灣族", "達悟族", "泰雅族"], 
                2, 
                ["(A) 錯誤。阿美族主要分布在花蓮、台東的縱谷與平原一帶。", 
                 "(B) 錯誤。排灣族主要分布在台灣南部的山區(屏東、屏東交界)。", 
                 "(C) 正確。達悟族(舊稱雅美族)世世代代居住在台灣東南海外的「蘭嶼」島上，以飛魚祭和拼板舟聞名。", 
                 "(D) 錯誤。泰雅族主要分布在台灣中、北部山區。"], 
                "原住民分布的基礎常識：蘭嶼＝達悟族(雅美族)；阿里山＝邵族；日月潭＝邵族(少數)；東部海岸/縱谷＝阿美族。");
            
            addQ("<img src=\"Exam-History-1/p6.jpg\" alt=\"第6題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">附圖是全球南島語系分布圖。根據此圖判斷,下列哪一地區最有可能不屬於南島語族?", 
                ["臺灣", "印尼", "菲律賓", "印度"], 
                3, 
                ["(A) 錯誤。臺灣位於南島語族分布的最北端，且被多數學者認為是南島語族的起源地。", 
                 "(B) 錯誤。印尼位於東南亞島嶼區，是南島語族分布的核心區域之一。", 
                 "(C) 錯誤。菲律賓緊鄰台灣南方，屬於南島語族重要的分布與遷徙路徑。", 
                 "(D) 正確。印度位於南亞次大陸，屬於印歐語系等其他語系，並不在南島語族（東至復活節島、西至馬達加斯加、北至台灣、南至紐西蘭）的分布範圍內。"], 
                "記住南島語族的分布極點：北(台灣)、南(紐西蘭)、西(非洲旁的馬達加斯加)、東(南美洲旁的復活節島)。");
            
            addQ("在臺灣史前文化遺址中,是以使用器物的種類與製作技術來畫分,其順序為:「打製石器→磨製石器或燒製陶器→鐵器。」下列有關文化遺址按上述先後排列,何者正確?", 
                ["長濱文化→卑南文化→十三行文化", "大坌坑文化→圓山文化→卑南文化", "長濱文化→大坌坑文化→圓山文化", "十三行文化→長濱文化→圓山文化"], 
                0, 
                ["(A) 正確。長濱文化(舊石器/打製) → 卑南文化(新石器晚期/磨製與陶器) → 十三行文化(金屬器/鐵器)，完美符合題幹的時代演進順序。", 
                 "(B) 錯誤。大坌坑、圓山、卑南全部都屬於「新石器時代」，缺乏舊石器與金屬器時代的代表。", 
                 "(C) 錯誤。長濱(舊石器) → 大坌坑(新石器) → 圓山(新石器)，選項中缺少了金屬器時代(鐵器)的代表。", 
                 "(D) 錯誤。十三行文化(鐵器)不可能排在最前面，時代完全錯亂。"], 
                "台灣史前三大時代代表：舊石器(長濱) → 新石器(大坌坑、圓山、卑南) → 金屬器(十三行)。");
            
            addQ("大明的家族旅遊行程中,某天行程主題是「臺東———重返新石器時代」。大明可以安排家人參觀哪一景點?", 
                ["圓山貝塚", "南關里遺址", "卑南遺址", "長濱文化博物館"], 
                2, 
                ["(A) 錯誤。圓山貝塚位於「臺北盆地」，不符合「臺東」的地點條件。", 
                 "(B) 錯誤。南關里遺址位於「臺南市」(南部科學園區內)。", 
                 "(C) 正確。卑南遺址位於「臺東市」，且為台灣最具代表性的「新石器時代」晚期遺址，以石板棺與玉器聞名。", 
                 "(D) 錯誤。長濱文化雖然位於「臺東」(八仙洞)，但它是「舊石器時代」的遺址，不符合「新石器時代」的主題。"], 
                "解題需要同時滿足兩個條件：1. 地點在「臺東」；2. 時代為「新石器時代」。");
            
            addQ("大湖文化遺址分布於高雄大武和臺南地區,1937年日本人發現此遺址,陸續出土許多紅、黑色的陶器和部分磨製的石器,其年代距今約3,300至2,000年。大湖文化遺址,最可能屬於下列哪一時期?", 
                ["舊石器時代", "新石器時代", "金屬器時代", "歷史時代"], 
                1, 
                ["(A) 錯誤。舊石器時代只會「打製」石器，且尚未發明陶器。", 
                 "(B) 正確。題幹提到出土「陶器」與「磨製石器」，這兩項正是判斷進入「新石器時代」最核心的兩大指標。", 
                 "(C) 錯誤。題幹中並未提到發現銅器、鐵器或煉鐵爐等金屬器時代的關鍵遺物。", 
                 "(D) 錯誤。歷史時代必須要有「文字」出現，題幹並未提及。"], 
                "不論看到什麼沒學過的史前文化名稱(如大湖文化、牛罵頭文化)，只要看到關鍵字「陶器」+「磨製石器」，勇敢選「新石器時代」！");
            
            addQ("清帝國統治時,將臺灣原住民族區分為「生番」及「熟番」,依據的標準為何?", 
                ["居住地區", "是否納稅、服勞役", "打獵或農耕", "語言系統"], 
                1, 
                ["(A) 錯誤。雖然熟番多住平地，生番多住山地，但清廷分類的官方標準並非純粹看居住地，而是政治上的歸化程度。", 
                 "(B) 正確。清帝國將願意歸順清廷、接受統治，並且「繳納賦稅(丁口稅)、服勞役(如傳遞公文)」的原住民稱為「熟番」；反之未歸化者稱為「生番」。", 
                 "(C) 錯誤。生計方式(打獵或農耕)不是清廷官方區分的標準。", 
                 "(D) 錯誤。清代並未依據現代語言學的系統來分類原住民。"], 
                "「平埔族/高山族」是後人依據居住地與漢化程度的概略俗稱；「生番/熟番」則是清朝政府依據有無「納稅服役(政治歸化)」的官方分類。");
            
            addQ("有篇文章提到:「蘭嶼與菲律賓的巴丹群島,兩地居民有相似度60%的語言,巴丹群島的口傳文學中,巴丹人因為海嘯而遷徙到蘭嶼,達悟族的口述歷史中,也流傳祖先來自巴丹群島。」根據上述內容判斷,此篇文章的主題應為下列何者?", 
                ["金屬器時代的貿易行為", "臺灣平埔族的文化傳承", "菲律賓與蘭嶼的貿易往來", "原住民的傳說與族群遷徙"], 
                3, 
                ["(A) 錯誤。文中並未提到鐵器、玻璃等金屬器時代的特徵與商品貿易。", 
                 "(B) 錯誤。達悟族居住在蘭嶼，傳統分類上屬於高山族(或島嶼原住民)，並非平埔族。", 
                 "(C) 錯誤。文章內容強調的是「語言相似」與「祖先遷徙」的口述歷史，而非單純的商品貿易。", 
                 "(D) 正確。文中透過語言的相似度以及雙方「因為海嘯而遷徙」、「祖先來自巴丹」的口述歷史與傳說，探討了南島語族在島嶼間的移動與族群淵源。"], 
                "傳說與語言的相似性，是人類學家追溯沒有文字的史前族群「遷徙路徑」最重要的證據之一。");
            
            addQ("史前文化實習隊在某處挖掘出三個遺址的出土文物如下,如果依照文化層的觀念判斷,下列排序何者正確?<br><br>甲遺址:出土陶器的碎片和磨製的石器<br>乙遺址:出土打製的石器和骨製的魚叉<br>丙遺址:出土玻璃的飾品和熔化的鐵渣", 
                ["甲→丙→乙", "乙→丙→甲", "丙→乙→甲", "乙→甲→丙"], 
                3, 
                ["(A) 錯誤。這代表新石器→金屬器→舊石器，時序混亂。", 
                 "(B) 錯誤。這代表舊石器→金屬器→新石器，時序混亂。", 
                 "(C) 錯誤。這代表金屬器→舊石器→新石器，時序混亂。", 
                 "(D) 正確。乙(打製石器=舊石器) → 甲(陶器/磨製石器=新石器) → 丙(鐵渣=金屬器)。依照人類文明發展，應由最原始的乙，進展到甲，最後是丙。地層分布上，乙在最底層，丙在最上層。"], 
                "判斷遺址年代三部曲：先找有沒有金屬(鐵/銅)？有就是最晚。再看石器是打製(舊)還是磨製+陶器(新)。");
            
            addQ("位於臺灣南部科學工業園區的南科考古館,館內展示了南關里遺址的文物,例如:細繩紋陶器、磨製的石刀與石斧。依據展示的文物可推測,南關里遺址最可能屬於下列哪一時期?", 
                ["舊石器時代", "新石器時代", "青銅器時代", "鐵器時代"], 
                1, 
                ["(A) 錯誤。舊石器時代還不會燒製陶器，石器也只會粗糙的打製。", 
                 "(B) 正確。出現「陶器」(細繩紋陶)以及「磨製石器」(石刀、石斧)，這是標準的「新石器時代」兩大特徵。", 
                 "(C) 錯誤。台灣史前時代並未經歷明顯的青銅器時代，且題幹未提及青銅文物。", 
                 "(D) 錯誤。題幹中並未提到煉鐵爐、鐵器或相關外來品，不屬於鐵器(金屬器)時代。"], 
                "看到「陶器」與「磨製石器」聯集，答案毫無懸念就是新石器時代。");
            
            addQ("<img src=\"Exam-History-1/p14.jpg\" alt=\"第14題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">附表呈現史前人類生活情形的變化,若要以「舊石器時代→新石器時代」的方式,表示舊石器時代至新石器時代的文化變遷,表中甲、乙、丙、丁何者最為適切?", 
                ["種植根莖類作物→種植稻米", "打製石器→磨製石器", "燒製陶器→冶煉鐵器", "不知用火→用火煮食"], 
                1, 
                ["(A) 錯誤。不管是種植根莖類還是稻米，只要出現「農業種植」，就已經是「新石器時代」內部(早期到晚期)的變化，無法代表舊石器跨越到新石器。", 
                 "(B) 正確。舊石器時代人類使用敲擊碎裂的「打製石器」；到了新石器時代，進步到懂得將石器加水磨光，變成「磨製石器」，這是最經典的時代變遷特徵。", 
                 "(C) 錯誤。「燒製陶器」是新石器特徵，「冶煉鐵器」是金屬器特徵，這代表的是新石器→金屬器時代的變遷。", 
                 "(D) 錯誤。人類在「舊石器時代早期」就已經「已知用火」，所以用火的變化發生在舊石器時代內部，而非跨時代指標。"], 
                "石器製作技術的改良（打製→磨製）是舊石器邁入新石器時代最重要的工藝里程碑。");
            
            addQ("鐵器的使用,是人類歷史文化進展的重要里程碑,而在臺灣的考古發掘中,哪一個文化遺址曾發現一座煉鐵作坊,顯示臺灣鐵器文化的開始?", 
                ["卑南文化", "圓山文化", "大坌坑文化", "十三行文化"], 
                3, 
                ["(A) 錯誤。卑南文化為新石器時代晚期，以石板棺與玉器為主。", 
                 "(B) 錯誤。圓山文化為新石器時代晚期，以貝塚為主。", 
                 "(C) 錯誤。大坌坑文化為新石器時代早期，以粗繩紋陶為主。", 
                 "(D) 正確。十三行文化(位於新北八里)出土了完整的煉鐵爐與鐵渣，是目前台灣考古證實最早進入「金屬器(鐵器)時代」的文化遺址。"], 
                "台灣史前時代的「鐵器/煉鐵」關鍵字，唯一對應的代表性遺址就是北部的「十三行文化」。");
            
            addQ("臺北縣八里鄉(今新北市八里區)十三行文化遺址,在歷史上具有下列何種重要的意義?", 
                ["代表採集生活的發端", "象徵磨製石器的出現", "反映稻米農作的起源", "顯示鐵器時代的開始"], 
                3, 
                ["(A) 錯誤。採集生活是人類最早(舊石器時代，如長濱文化)的生存方式。", 
                 "(B) 錯誤。磨製石器的出現象徵進入新石器時代(如大坌坑文化)。", 
                 "(C) 錯誤。稻米農作在台灣新石器時代中晚期(如圓山、卑南文化)已經相當發達。", 
                 "(D) 正確。十三行文化最重大的考古發現就是「煉鐵爐」，這代表台灣先民的工藝技術跨越了石器時代，正式顯示「鐵器時代(金屬器時代)的開始」。"], 
                "十三行 = 煉鐵 = 金屬器時代。這是台灣史前史最常考的等式。");
            
            addQ("<img src=\"Exam-History-1/p17.jpg\" alt=\"第17題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">附圖為臺灣某一史前文化遺址的圖片(陶窯遺跡、煉鐵爐、中國銅錢),根據其內容判斷,此一文化應為下列何者?", 
                ["長濱文化", "圓山文化", "大坌坑文化", "十三行文化"], 
                3, 
                ["(A) 錯誤。長濱文化(舊石器)不會有陶窯、煉鐵爐或銅錢。", 
                 "(B) 錯誤。圓山文化(新石器)有陶器，但沒有煉鐵爐與銅錢。", 
                 "(C) 錯誤。大坌坑文化(新石器)只有早期陶器，無煉鐵爐與銅錢。", 
                 "(D) 正確。圖中出現了最關鍵的「煉鐵爐」(代表金屬器時代)以及「中國銅錢」(代表強烈的海外貿易交流)，這兩點完美吻合十三行文化的特徵。"], 
                "在多種遺跡同時出現時，以「最進步、最晚發生」的科技為判斷基準。看到鐵爐與錢幣，必為十三行。");
            
            addQ("<img src=\"Exam-History-1/p18.jpg\" alt=\"第18題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">附圖為臺灣部分原住民族群的祭典與主要分布圖。若按圖片內容判斷,雅美族(達悟族)應為圖中何者?", 
                ["甲(矮靈祭)", "乙(猴祭)", "丙(飛魚祭)", "丁(豐年祭)"], 
                2, 
                ["(A) 錯誤。甲(北部山區)舉辦「矮靈祭」的是賽夏族。", 
                 "(B) 錯誤。乙(東南部)舉辦「猴祭」的是卑南族。", 
                 "(C) 正確。丙位於台灣東南外海的蘭嶼，且祭典標示為「飛魚祭」，這正是達悟族(雅美族)最著名的傳統文化。", 
                 "(D) 錯誤。丁(東部海岸縱谷)舉辦「豐年祭」的主要是阿美族。"], 
                "將原住民族群與其特色祭典及地理位置綁定記憶：達悟族=蘭嶼=飛魚祭；賽夏族=新竹苗栗山區=矮靈祭。");
            
            addQ("<img src=\"Exam-History-1/p19.jpg\" alt=\"第19題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">鈞憶將圖(一)中的五張卡片分為圖(二)中的三類(卑南/大坌坑/圓山 一類，長濱一類，十三行一類),其分類的依據最可能是下列何者?", 
                ["製作器物的技術", "文字發展的程度", "居住區域的位置", "使用貨幣的類型"], 
                0, 
                ["(A) 正確。圖二清楚地將遺址分為：新石器時代(卑南/大坌坑/圓山-磨製石器)、舊石器時代(長濱-打製石器)、金屬器時代(十三行-煉鐵)。這種分期的核心依據就是「人類製作器物的材質與技術」。", 
                 "(B) 錯誤。這五個文化都屬於史前時代，皆無文字發展，無法以此分類。", 
                 "(C) 錯誤。這五個文化散布北(圓山/十三行)、東(長濱/卑南)、全台(大坌坑)，並非依據地理位置分這三堆。", 
                 "(D) 錯誤。只有十三行文化有發現外來錢幣，其他都沒有，無法成為分成三類的依據。"], 
                "考古學家劃分舊石器、新石器、金屬器時代的唯一共通標準，就是當時人類掌握的「工藝技術(石器打磨、冶金)」。");
            
            addQ("<img src=\"Exam-History-1/p20.jpg\" alt=\"第20題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">附圖是博物館展覽時張貼的簡介(發現於臺灣東部、石板屋、石棺、陪葬玉飾),由其中資訊判斷,這場展覽應是介紹下列哪一文化?", 
                ["長濱文化", "圓山文化", "卑南文化", "十三行文化"], 
                2, 
                ["(A) 錯誤。長濱文化在東部，但屬於舊石器，無石棺、玉飾或農耕。", 
                 "(B) 錯誤。圓山文化位於北部，以貝塚聞名。", 
                 "(C) 正確。簡介提到「臺灣東部」、「石板屋/石棺墓葬群」以及「豐富的陪葬玉飾」，這些都是臺東「卑南文化」(新石器時代晚期)最具標誌性的文化特徵。", 
                 "(D) 錯誤。十三行文化位於北部，以煉鐵聞名。"], 
                "卑南文化三大關鍵字必記：臺東、大量石板棺、精美台灣玉飾。");
            
            addQ("舊石器時代的臺灣,人們居住在洞穴或岩蔭中,過著採集、狩獵和漁撈的生活,且已知用火與製作石器。下列哪一文化為此時期的代表?", 
                ["長濱文化", "卑南文化", "圓山文化", "十三行文化"], 
                0, 
                ["(A) 正確。長濱文化(位於台東八仙洞)是台灣目前已知最早的人類遺跡，完全符合舊石器時代住在洞穴、打製石器、採集漁獵的特徵。", 
                 "(B) 錯誤。卑南文化為新石器時代晚期代表。", 
                 "(C) 錯誤。圓山文化為新石器時代晚期代表。", 
                 "(D) 錯誤。十三行文化為金屬器時代代表。"], 
                "長濱文化的特徵就是「三無一有」：無陶器、無農業、無定居(穴居)，只有打製石器與用火。");
            
            addQ("<img src=\"Exam-History-1/p22.jpg\" alt=\"第22題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">附圖是曉華在書上看到的漫畫(圖中顯示干欄式住屋、農耕、煉鐵),此圖最可能是描繪臺灣哪一史前文化?", 
                ["長濱文化", "圓山文化", "十三行文化", "大坌坑文化"], 
                2, 
                ["(A) 錯誤。長濱文化(舊石器)住洞穴，無農耕與煉鐵。", 
                 "(B) 錯誤。圓山文化(新石器)有農耕，但沒有煉鐵技術。", 
                 "(C) 正確。漫畫中出現了「煉鐵」，這是金屬器時代獨有的特徵。同時十三行文化人也具備農耕能力並居住在架高的「干欄式建築」中，完全吻合圖意。", 
                 "(D) 錯誤。大坌坑文化(新石器)無煉鐵技術。"], 
                "圖片中只要看到「煉鐵/打鐵」的動作或高溫爐，不用猶豫，直接選台灣唯一的金屬器代表：十三行文化。");
            
            addQ("阿華至博物館參觀卑南文化遺址的展覽,他最可能在展覽中看到哪一項該史前文化的出土文物?", 
                ["銅錢", "陶罐", "鐵製農具", "甲骨文"], 
                1, 
                ["(A) 錯誤。銅錢是十三行文化(金屬器時代)與外界貿易才出現的物品。", 
                 "(B) 正確。卑南文化屬於「新石器時代」，新石器時代的重大特徵之一就是發明了「燒製陶器」，因此展覽中必定會看到各式陶罐。", 
                 "(C) 錯誤。鐵製農具必須等到十三行文化(金屬器時代)才會出現。", 
                 "(D) 錯誤。甲骨文是中國商朝的文字，台灣史前時代(包含卑南)完全沒有發展出文字系統。"], 
                "卑南文化 = 新石器時代。新石器時代的標配就是「陶器」與「磨製石器」。");
            
            addQ("<img src=\"Exam-History-1/p24.jpg\" alt=\"第24題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">附表中的甲、乙、丙、丁代表不同史前文化的經濟活動,其中何者最適合用來描述長濱文化?<br>甲：以採集、狩獵、漁撈方式維生<br>乙：鐵製工具用於狩獵、農耕<br>丙：以捕魚為主,已能種植農作物<br>丁：大量栽培稻米,也從事狩獵", 
                ["甲", "乙", "丙", "丁"], 
                0, 
                ["(A) 正確。長濱文化屬於舊石器時代，人類尚未學會農業種植與畜牧，只能依賴大自然，過著「採集、狩獵、漁撈」的生活。", 
                 "(B) 錯誤。乙提到「鐵製工具」，屬於金屬器時代(十三行)。", 
                 "(C) 錯誤。丙提到「種植農作物」，代表已進入新石器時代(如大坌坑早期)。", 
                 "(D) 錯誤。丁提到「大量栽培稻米」，屬於新石器中晚期(如圓山、卑南)農業發達的特徵。"], 
                "判斷長濱文化(舊石器)的唯一準則：絕對沒有「農業」與「陶器」。一切靠雙手向大自然索取。");
            
            addQ("<img src=\"Exam-History-1/p25.jpg\" alt=\"第25題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">附圖是校外教學學習單的主題(重返石器時代：來到臺東,透過陶器、石板棺、陪葬玉器...一起想像),依內容判斷,此學習單介紹的最可能是下列哪一史前文化遺址?", 
                ["長濱文化", "圓山文化", "卑南文化", "十三行文化"], 
                2, 
                ["(A) 錯誤。長濱雖然在台東，但屬於舊石器時代，不會有陶器和石板棺。", 
                 "(B) 錯誤。圓山文化位在台北盆地。", 
                 "(C) 正確。學習單提示了三個關鍵字：「臺東」、「石板棺」、「陪葬玉器」，這三者完美拼湊出「卑南文化」的面貌。", 
                 "(D) 錯誤。十三行文化位在新北八里，且屬於金屬器時代。"], 
                "卑南文化的「石板棺」是東亞地區規模最大的史前墓葬群，加上精美的「台灣玉」飾品，是考試極常出現的辨識點。");
            
            addQ("<img src=\"Exam-History-1/p26.jpg\" alt=\"第26題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">附圖是安達看到的一幅圖(涵蓋台灣、夏威夷、紐西蘭、馬達加斯加),若要給這幅圖一個圖名,下列何者最適合?", 
                ["南島語族分布圖", "全球雨林殘存區域圖", "臺灣農產品進口區域圖", "大坌坑文化分布圖"], 
                0, 
                ["(A) 正確。圖中的黑色框線範圍，北極點在台灣，東達太平洋的復活節島/夏威夷，南至紐西蘭，西達印度洋的馬達加斯加。這是標準的「南島語族」地理分布圖。", 
                 "(B) 錯誤。雨林多分布於赤道附近(如亞馬遜、剛果)，與此圖分布不符。", 
                 "(C) 錯誤。台灣的農產品進口來源遍布全球(如美、澳、日)，不會呈現這種特定的島嶼分布形狀。", 
                 "(D) 錯誤。大坌坑文化僅分布於台灣本島及部分沿海，範圍不可能跨越兩大洋。"], 
                "這是南島語族最經典的「跨洋分布圖」，請牢記它的四個極點(東西南北)。");
            
            addQ("曉蘭利用週休假期,安排了一趟臺灣北部、東部之旅。她沿途參觀了許多考古發掘的遺址,如:煉鐵的十三行文化、用陶器的靜浦文化、打製石器的長濱文化、以玉石陪葬的卑南文化等。根據上述文化特色判斷,其中哪一個文化是最早出現的?", 
                ["十三行文化", "靜浦文化", "長濱文化", "卑南文化"], 
                2, 
                ["(A) 錯誤。十三行文化(煉鐵)屬於金屬器時代，年代最晚。", 
                 "(B) 錯誤。靜浦文化(鐵器/陶器)為東部鐵器時代代表，年代極晚。", 
                 "(C) 正確。長濱文化特徵為「打製石器」，屬於「舊石器時代」，距今約三萬年以上，是四個選項中年代最久遠、最早出現的文化。", 
                 "(D) 錯誤。卑南文化(玉器/陶器)屬於新石器時代晚期。"], 
                "解題關鍵：看到「最早」就找「舊石器時代」；看到「舊石器時代」就找「打製石器」或「長濱文化」。");
            
            addQ("亞婷參觀「臺灣史前文化演進」展覽,若她想按照文化演進先後依序參觀,應先前往下列哪一主題區?", 
                ["十三行文化", "大坌坑文化", "長濱文化", "圓山文化"], 
                2, 
                ["(A) 錯誤。十三行(金屬器)是最晚的階段。", 
                 "(B) 錯誤。大坌坑(新石器早期)排在第二階段。", 
                 "(C) 正確。史前文化的演進順序為：舊石器 → 新石器 → 金屬器。長濱文化屬於「舊石器時代」，是時間軸上的起點，理應最先參觀。", 
                 "(D) 錯誤。圓山文化(新石器晚期)排在第三階段。"], 
                "排序口訣：長濱(舊) -> 大坌坑(新早) -> 圓山/卑南(新晚) -> 十三行(金屬)。");
            
            addQ("小潔利用暑假參加「臺灣史蹟研習營」,解說員在介紹一處遺址時說:「這個文化聚落主要位於河、湖邊和海岸附近,居民以捕魚、狩獵及種植穀物為生,許多生產工具和武器是用鐵製作的。」這處遺址最可能屬於下列哪一文化?", 
                ["長濱文化", "卑南文化", "大坌坑文化", "十三行文化"], 
                3, 
                ["(A) 錯誤。長濱為舊石器，無農業與鐵器。", 
                 "(B) 錯誤。卑南為新石器，雖有農業但無鐵器。", 
                 "(C) 錯誤。大坌坑為新石器早期，無鐵器。", 
                 "(D) 正確。解說員提到關鍵字「武器是用鐵製作的」，只要出現「鐵器」，就代表該文化已進入金屬器時代，台灣史前史中對應的就是「十三行文化」。"], 
                "題目敘述再長，只要抓到「鐵製」兩個字，就可以秒殺作答十三行文化。");
            
            addQ("考古學者在臺灣東部發現距今約三萬年前的史前人類生活遺跡,推估當時的人們已經懂得打製粗糙的石器,但還沒有磨製石器的技巧,也不懂如何蓋房子,而是住在天然的洞穴裡。這些史前人類最可能以下列何種方式維持生活?", 
                ["牧養牛羊", "採集漁獵", "種植稻米", "圈養家畜"], 
                1, 
                ["(A) 錯誤。牧養動物需要農業革命後的技術，舊石器時代尚不具備。", 
                 "(B) 正確。距今三萬年、只懂「打製」石器、住「洞穴」，這些都是「舊石器時代」(長濱文化)的特徵。當時人類不會生產食物，只能靠大自然給予，因此以「採集植物、狩獵野獸、漁撈」維生。", 
                 "(C) 錯誤。種植稻米是新石器時代中晚期的特徵。", 
                 "(D) 錯誤。圈養家畜是新石器時代才開始出現的行為。"], 
                "舊石器時代的生活模式：自然給什麼，就吃什麼（採集、漁獵），住在天然的遮蔽物（洞穴）裡。");
            
            addQ("<img src=\"Exam-History-1/p31.jpg\" alt=\"第31題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">附圖呈現古代人類的幾種生活樣貌,臺灣的大坌坑文化應涵蓋其中哪些活動?<br>甲:製作陶器, 乙:製作鐵器, 丙:漁獵, 丁:農耕, 戊:磨製石器, 己:使用文字", 
                ["甲乙丁戊", "甲丙丁戊", "乙丁戊己", "丙丁戊己"], 
                1, 
                ["(A) 錯誤。大坌坑屬於新石器時代，不會有「乙(製作鐵器)」。", 
                 "(B) 正確。大坌坑文化是台灣「新石器時代」早期的代表。具備特徵有：甲(燒製粗繩紋陶器)、戊(使用磨製石器)、丁(開始初期的根莖類農耕)，且人類依然會保留舊石器時代的丙(漁獵)技能來補充食物。", 
                 "(C) 錯誤。包含乙(鐵器)與己(文字)，皆不符合大坌坑特徵。", 
                 "(D) 錯誤。包含己(文字)，台灣史前文化皆無文字。"], 
                "新石器時代雖然發明了農業，但不會放棄打獵捕魚；就像現代人會種田，但也依然會去釣魚一樣。");
            
            addQ("<img src=\"Exam-History-1/p32.jpg\" alt=\"第32題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">附圖是臺灣三個史前文化遺址的分布圖(甲:十三行, 乙:大坌坑, 丙:長濱),若依文化存在年代的先後順序排列,下列何者正確?", 
                ["甲→乙→丙", "乙→丙→甲", "丙→乙→甲", "乙→甲→丙"], 
                2, 
                ["(A) 錯誤。順序完全顛倒 (金屬器→新石器→舊石器)。", 
                 "(B) 錯誤。順序錯亂 (新石器→舊石器→金屬器)。", 
                 "(C) 正確。丙(長濱)為舊石器時代，年代最久遠；乙(大坌坑)為新石器時代早期，居中；甲(十三行)為金屬器時代，年代最晚。因此順序為 丙 → 乙 → 甲。", 
                 "(D) 錯誤。乙不應該排在最前面。"], 
                "長濱(舊) -> 大坌坑(新) -> 十三行(金屬)，這是台灣史前史最基礎的年代光譜。");
            
            addQ("貝塚為該遺址最大的特色,它保存大量食用後的貝殼和獸骨、魚骨等。依貝塚所保存下來食物殘渣推測,當時人類已飼養家畜、種植稻米等作物。下列敘述何者正確?", 
                ["這個遺址是卑南遺址", "這是舊石器時代的遺址", "這個遺址位在今日的臺北市", "這個遺址的人會煉鐵"], 
                2, 
                ["(A) 錯誤。卑南遺址的最大特色是石板棺與玉器，而非大型貝塚。", 
                 "(B) 錯誤。文中提到「已飼養家畜、種植稻米」，證明它已經進入「新石器時代」。", 
                 "(C) 正確。「龐大貝塚」是台灣史前文化中「圓山文化」最著名的標誌，而圓山文化遺址正位於今日的「臺北市」圓山一帶。", 
                 "(D) 錯誤。圓山文化屬於新石器時代，當時的人類還沒有掌握煉鐵技術。"], 
                "關鍵字連結：貝塚 = 圓山文化 = 臺北盆地 = 新石器時代。");
            
            addQ("下列關於臺灣原住民的兩大族群「平埔族」和「高山族」的比較,何者敘述正確?", 
                ["平埔族居住在東部平原地帶;高山族居住在西部丘陵地帶", "日治時期稱平埔族為熟番,稱高山族為生番", "平埔族的漢化程度較深;高山族與漢人接觸較晚", "清帝國時期稱平埔族為生番,稱高山族為熟番"], 
                2, 
                ["(A) 錯誤。平埔族主要居住在「西部平原」；高山族主要居住在「中央山脈及東部」。", 
                 "(B) 錯誤。「生番、熟番」是清帝國時期的官方分類稱呼。日治時期改稱平埔族(平埔)與高砂族。", 
                 "(C) 正確。平埔族因為住在西部平原，較早與渡海來台的漢人頻繁接觸與通婚，因此「漢化程度較深」，甚至逐漸失去母語；高山族因地勢阻隔，接觸較晚，保留較多傳統文化。", 
                 "(D) 錯誤。清帝國依納稅服役區分。通常平埔族多歸順成為「熟番」，高山族多未歸順被視為「生番」。"], 
                "平原(平埔)容易抵達，漢化早且深；高山地形險阻，漢化晚且淺。");
            
            addQ("2023年5月臺灣史前文化博物館重新開張。館長發表演說如下：「島是船、海是路...形成獨有的臺灣與世界南島文化。臺灣500年來以語言、構樹、工藝等輸出影響大洋洲...也讓世界更認識臺灣。」關於這段演說,我們不該做何種理解?", 
                ["以臺灣為起點,南島語族擴散至東南亞", "太平洋諸島上也有南島語族的足跡", "臺灣是南島語族遷徙過程中最後的終點", "想全面認識南島語族不該僅限研究臺灣"], 
                2, 
                ["(A) 觀念正確(不選)。許多語言學與考古學證據支持「出台灣說」，認為台灣是南島語族向外擴散的起點。", 
                 "(B) 觀念正確(不選)。南島語族的足跡遍布廣大的太平洋島嶼(如夏威夷、復活節島)。", 
                 "(C) 觀念錯誤(應選)。演說中提到台灣「輸出影響大洋洲」，證明台灣是南島語族遷徙的「起點」或「中繼站」，絕對不是最後停止移動的「終點」。", 
                 "(D) 觀念正確(不選)。南島語族分布極廣，確實需要宏觀的世界史視角來全面研究。"], 
                "「出台灣說 (Out of Taiwan)」是目前國際南島語族研究的主流學說，強調台灣是擴散的發源地。");
            
            addQ("史前文化博物館的南島廳,以「南島世界,世界南島」為主軸,從南島族群的視角理解大洋多樣的文化面貌,並從世界史的角度認識群島與不同文化的獨特互動。展示的範圍不包括下列何者?", 
                ["奧特亞羅瓦(紐西蘭)", "馬達加斯加", "復活島", "澳洲"], 
                3, 
                ["(A) 包括在內。紐西蘭的毛利人屬於南島語族，是分布範圍的「最南端」。", 
                 "(B) 包括在內。非洲東岸的馬達加斯加島居民語言屬南島語系，是分布範圍的「最西端」。", 
                 "(C) 包括在內。太平洋上的復活節島(復活島)居民屬南島語族，是分布範圍的「最東端」。", 
                 "(D) 不包括(正解)。澳洲原住民(Aboriginal Australians)屬於獨立的族群與語系，並不屬於南島語族。南島語族在擴散時繞過了澳洲大陸。"], 
                "南島語族的版圖雖然龐大，但剛好跳過了整塊澳洲大陸，這是一個常考的陷阱。");
            
            addQ("在十三行文化遺址中,出土了瑪瑙珠、玻璃製品,以及其他材質的珠子,還發現青銅鎏金碗、銅刀柄、銅幣等來自於東南亞或中國的外來物品。由上述內容可推論出下列何者?", 
                ["屬於新石器時代的文化", "與其他地區的貿易往來", "已具有國家的規模", "已進入歷史時代"], 
                1, 
                ["(A) 錯誤。出土了大量金屬器(青銅、銅幣)，這代表十三行已經跨入金屬器時代，而非新石器時代。", 
                 "(B) 正確。瑪瑙、玻璃、青銅器與中國銅錢在台灣本島無法自行產出，這些「外來物品」的集中出現，是十三行先民具備航海能力，並與海外(東南亞、中國)進行「頻繁貿易往來」的鐵證。", 
                 "(C) 錯誤。雖然有貿易，但目前的考古證據尚不足以證明十三行文化已經發展出具備完整政府組織的「國家」規模。", 
                 "(D) 錯誤。雖然出土了有文字的「中國銅錢」，但那是當作貿易品或飾品，十三行先民本身並未發明或使用文字記錄歷史，故仍屬史前時代。"], 
                "史前遺址中的「外國貨」，就是史前人類當過「國際貿易商」的最佳證據。");
            
            addQ("上歷史課時,老師說這是一個很方便臺北學生前往參觀的遺跡,這個遺跡見證臺北盆地從臺北湖變成今日繁華的臺北市,只需要搭著捷運紅線就可以抵達,還可以順便參觀附近的美術館、花博公園,最後前往淡水看夕陽。遺跡指的是下列何者?", 
                ["十三行文化", "圓山文化", "長濱文化", "卑南文化"], 
                1, 
                ["(A) 錯誤。十三行文化位在新北市「八里」，捷運紅線無法直達，需轉乘渡輪或公車。", 
                 "(B) 正確。關鍵字「臺北盆地」、「捷運紅線」、「美術館/花博旁」，完美指向位於臺北市區圓山捷運站附近的「圓山文化遺址」。圓山貝塚見證了該地曾經是湖泊邊緣的歷史。", 
                 "(C) 錯誤。長濱文化遠在臺東。", 
                 "(D) 錯誤。卑南文化遠在臺東。"], 
                "將歷史遺址結合現代地理位置來考是常見題型。台北市區內最著名的史前遺跡就是圓山貝塚。");
            
            addQ("在臺灣原住民中,某一族群因為較晚與漢人接觸,漢化程度不如平埔族來的深,如今明顯看得出與漢民族的差異。我們可從下列哪一敘述來認識上述族群?", 
                ["此族群多分布在臺灣平原與西部地區", "十三行文化人極有可能是這個族群的祖先", "白鹿傳說是此族群重要的文化記憶", "在清帝國時期此族群因有納稅而被稱做「熟番」"], 
                2, 
                ["(A) 錯誤。分布在西部平原且早接觸漢人的是「平埔族」。", 
                 "(B) 錯誤。十三行文化人通常被認為與北部平埔族(如凱達格蘭族)有較深的淵源。", 
                 "(C) 正確。題幹描述的是「高山族」(較晚接觸、漢化淺)。選項中「白鹿傳說」是邵族的經典神話，邵族傳統上被歸類在高山族群中，符合題幹對該類族群的認知。", 
                 "(D) 錯誤。清代納稅服役的稱為「熟番」(多為平埔族)；高山族多半未歸化，被稱為「生番」。"], 
                "邵族的「白鹿傳說」：相傳祖先打獵時追逐一隻白鹿，白鹿帶領他們發現了美麗豐饒的日月潭，從此定居。");
            
            addQ("臺灣某時期將原住民分類,若符合以下條件者,稱為「熟番」,未符合者稱之為「生番」。<br>(一)服徭役:例如遞送公文、搬運、抬轎等勞役。<br>(二)納稅餉:上繳丁口稅。<br>上述應屬於下列哪一時期的分類方式?", 
                ["荷治時期", "日治時期", "清帝國時期", "中華民國時期"], 
                2, 
                ["(A) 錯誤。荷治時期透過「贌社」制度收稅與召集地方會議，但並未使用生番、熟番的官方稱呼。", 
                 "(B) 錯誤。日治時期初期沿用，後期改稱「平埔族」與「高砂族」。", 
                 "(C) 正確。「生番」與「熟番」是「清帝國時期」最典型的原住民官方分類法。其核心標準完全建立在政治義務上：是否願意向清廷繳納賦稅與服勞役。", 
                 "(D) 錯誤。中華民國時期使用山地同胞、原住民等稱呼。"], 
                "清朝管不管得動原住民，就看原住民願不願意繳稅跟當差。願意就是熟番，不願意就是生番。");
            
            addQ("<img src=\"Exam-History-1/p41.jpg\" alt=\"第41題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">附圖是臺灣某考古遺址中,同一文化層出土的四種石器(甲:架高陶罐的石支腳, 乙:錘打的凹石, 丙:磨利當地生產鐵器的砥石, 丁:綁漁網的網墜)。圖中何者最適合作為判斷該文化層所屬時代的證據?", 
                ["甲", "乙", "丙", "丁"], 
                2, 
                ["(A) 錯誤。甲(陶罐的石支腳)證明有陶器，這在新石器時代就已經出現。", 
                 "(B) 錯誤。乙(錘打用的凹石)在舊石器時代打製石器時就可能使用。", 
                 "(C) 正確。丙的用途是「磨利當地生產的鐵器」。只要該文化能「生產鐵器」，就無庸置疑地代表他們已經進入最晚階段的「金屬器(鐵器)時代」。鐵器是判斷時代演進的最決定性證據。", 
                 "(D) 錯誤。丁(網墜)用於漁撈，從舊石器到新石器都有可能使用。"], 
                "同一地層出土多種時代特徵物時，必須以「最晚發明/最先進」的技術來定調該地層的時代。鐵器最晚，故定調為金屬器時代。");
            
            addQ("<img src=\"Exam-History-1/p42.jpg\" alt=\"第42題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">附表為慧文對臺灣某一史前文化的概略整理(年代：4500-6500年，分布：西部河口海岸，特徵：粗繩紋陶、可能種根莖作物，意義：新石器早期代表)。從表中內容判斷,此一史前文化應為下列何者?", 
                ["長濱文化", "卑南文化", "大坌坑文化", "十三行文化"], 
                2, 
                ["(A) 錯誤。長濱文化是舊石器時代，距今三萬年，沒有陶器。", 
                 "(B) 錯誤。卑南文化是新石器時代晚期，主要在東部，非西部河口。", 
                 "(C) 正確。表格揭示的關鍵字：「粗繩紋陶」、「可能種植根莖類」、「新石器時代早期」，這些全都是「大坌坑文化」的標準教科書特徵。", 
                 "(D) 錯誤。十三行文化是金屬器時代，距今約2000年內。"], 
                "大坌坑文化的身份證：新石器時代的「開路先鋒」(早期)，標誌性產物是「粗糙的繩紋陶器」。");
            
            addQ("<img src=\"Exam-History-1/p43.jpg\" alt=\"第43題圖表\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">小彩利用假期參觀一處史前文化遺址,在參觀過程中,她以表格紀錄這處遺址的特徵如附表(位置:臺灣北部, 生活方式:漁獵、農耕, 器具:陶罐、鐵斧)。下列何者最可能是這處文化遺址?", 
                ["長濱文化", "圓山文化", "大坌坑文化", "十三行文化"], 
                3, 
                ["(A) 錯誤。長濱文化在東部，且沒有鐵斧。", 
                 "(B) 錯誤。圓山文化雖然在北部有農耕，但沒有金屬製的鐵斧。", 
                 "(C) 錯誤。大坌坑文化遍布海岸，但屬新石器早期，不會有鐵斧。", 
                 "(D) 正確。表格中的決定性關鍵字是器具欄的「鐵斧」。出現鐵器即為金屬器時代，而台灣最具代表性且位於「臺灣北部」(八里)的金屬器遺址就是十三行文化。"], 
                "只要在器具中看到「鐵」字，不論其他條件是什麼，直接對應十三行文化。");
            
            addQ("民國79年,中研院在臺北縣八里鄉(今新北市八里區)汙水處理廠預定地上,發掘出先民使用過的陶罐、鐵刀,和骨製的矛與魚鉤等器具。由這些出土文物,可看出此一文化遺址應屬於哪一時代?", 
                ["舊石器時代", "新石器時代早期", "新石器時代晚期", "金屬器時代"], 
                3, 
                ["(A) 錯誤。舊石器時代只有打製石器與骨角器，沒有陶罐與鐵刀。", 
                 "(B) 錯誤。新石器早期(大坌坑)只有陶器與石器，沒有鐵刀。", 
                 "(C) 錯誤。新石器晚期(圓山/卑南)有精美陶器與農業，但依然沒有金屬製的鐵刀。", 
                 "(D) 正確。題幹提到地點在「八里」，且出土了「鐵刀」。鐵器的出現明確宣告了該遺址的先民已經掌握冶金技術，正式邁入「金屬器時代」。"], 
                "十三行遺址的發現過程常被當作考題背景(污水處理廠預定地搶救發掘)。出土鐵器=金屬器時代。");
            
            addQ("老師在上課時講述了兩則關於原住民的傳說,我們該怎麼看待?", 
                ["口語敘述的故事,是先祖的傳承,呈現出先祖經歷過的事實", "原住民的「始祖傳說」,靈感來自西方人的《聖經》故事", "原住民的「白鹿傳說」,跟部落的生活方式有關", "皆有歷史傳說記憶,代表臺灣所有原住民有共同祖先"], 
                2, 
                ["(A) 錯誤。神話與傳說雖然包含祖先的記憶傳承，但往往經過誇飾與神格化，不能百分之百等同於客觀發生的「歷史事實」。", 
                 "(B) 錯誤。台灣原住民各族擁有自己本土且古老的創世始祖傳說(如巨石生人、竹子生人等)，這些傳說早於西方宗教傳入台灣。", 
                 "(C) 正確。邵族的「白鹿傳說」描述祖先為了追逐獵物(白鹿)而翻山越嶺，最終發現適合定居的日月潭。這充分反映了原住民早期以「狩獵」為核心的遷徙與生活方式。", 
                 "(D) 錯誤。各族原住民的始祖傳說截然不同(有石頭生、樹生、蛇生等)，這反而暗示了他們可能擁有多元的起源與祖先，而非單一共同祖先。"], 
                "神話傳說雖然不是精確的史書，但卻像是一面鏡子，真實反映了該族群早期的生活環境與生計模式。");
            
            addQ("學習南島語族的起源之後,你覺得下列哪一種推論,最不合理?", 
                ["由構樹的分布,可知臺灣原住民與東南亞有貿易交流", "在各地找到的構樹文物,都是臺灣原住民的先民製造出來的", "臺灣的南島語言最多元分歧,代表臺灣很可能是南島語的起源地", "想證明一個重要的學科推論,需要運用不同學科的知識,彼此佐證"], 
                1, 
                ["(A) 合理(不選)。構樹(常用來做樹皮布)的基因研究顯示太平洋島嶼的構樹多源自台灣，這證明了先民遷徙時有帶著植物移動或交流。", 
                 "(B) 最不合理(應選)。台灣原住民的先民在遷徙過程中，帶去的是構樹的「種子或樹苗」，讓植物在當地繁衍。當地出土的構樹「文物」(如樹皮布)，是當地南島後裔自行製造的，並非全在台灣製造好才運過去。", 
                 "(C) 合理(不選)。在語言學中，一個語言系統歧異度最高、最複雜的地方，通常就是該語言的發源地。台灣南島語的高度歧異是「出台灣說」的重要證據。", 
                 "(D) 合理(不選)。南島語族的研究結合了考古學、語言學、甚至植物基因學(構樹)等多學科的交叉驗證。"], 
                "先民航海遷徙時，帶走的是動植物的「活體(種子/家畜)」，以便在新天地繁衍求生，而不是帶滿倉庫的消耗品。");
            
            addQ("<img src=\"Exam-History-1/p47.jpg\" alt=\"題組附圖\" class=\"max-w-full rounded-xl shadow-md mb-4 border border-rose-100 mx-auto\">考古學家在宜蘭縣發現的漢本遺址...日前更出土了一枚開元通寶...在此更有一個重大發現,煉鐵爐與鐵器更是一大突破...<br>由文中敘述的漢本遺址出土文物判斷,與附圖中哪一史前遺跡挖掘出的文物相類似?(甲:大坌坑, 乙:十三行, 丙:圓山, 丁:卑南)", 
                ["甲", "乙", "丙", "丁"], 
                1, 
                ["(A) 錯誤。甲若為大坌坑(新石器早期)，無煉鐵遺跡。", 
                 "(B) 正確。文章中反覆強調漢本遺址的重大突破是「煉鐵爐與鐵器」。在台灣已知的史前遺址中，擁有成熟煉鐵技術的金屬器時代代表就是「十三行文化」(圖中的乙)。兩者在文化層級上相吻合。", 
                 "(C) 錯誤。丙若為圓山(新石器晚期)，無煉鐵遺跡。", 
                 "(D) 錯誤。丁若為卑南(新石器晚期)，無煉鐵遺跡。"], 
                "閱讀素養題：文章的核心亮點在「煉鐵爐」。只要抓到這個字眼，對應的歷史知識就是「十三行文化/金屬器時代」。");
            
            addQ("由漢本遺址出土的文物(開元通寶、金箔、瑪瑙、玻璃、煉鐵),最可能推得下列何種論點?", 
                ["臺灣本島內的族群之間往來密切平凡", "來自中國大陸的漢人將文化移植臺灣", "當時先民與島外地區有密切的貿易往來", "當時的史前先民已擁有精湛鑄銅的技術"], 
                2,

                    const freshQ = freshQuestions.find(fq => fq.q === oldQ.q);
                    if (freshQ) return { ...freshQ, showExplanation: oldQ.showExplanation, selectedAns: oldQ.selectedAns, isCorrect: oldQ.isCorrect };

                    <div class="p-6 bg-rose-50 flex justify-between items-center border-b-2 border-dashed border-rose-200 shrink-0">
                        <span class="font-extrabold text-2xl text-rose-600">📑 學習目錄 🗺️</span>
                        <button onclick="toggleLearnMenu(false)" class="text-rose-400 hover:text-rose-600 transition-colors bg-white w-10 h-10 rounded-full flex items-center justify-center shadow-sm border border-rose-200"><i class="fas fa-times text-xl"></i></button>
                        </div>
                    <ul class="py-4 flex-1 px-3 space-y-2">
                        ${learnData.map(d => {
                            const isSelected = learnSubTab === d.id;
                            const themeConfig = {
                                'orange': isSelected ? 'bg-orange-500 text-white border-orange-600 shadow-md' : 'text-orange-600 border-orange-200 hover:bg-orange-50',
                                'teal': isSelected ? 'bg-teal-500 text-white border-teal-600 shadow-md' : 'text-teal-600 border-teal-200 hover:bg-teal-50',
                                'emerald': isSelected ? 'bg-emerald-500 text-white border-emerald-600 shadow-md' : 'text-emerald-600 border-emerald-200 hover:bg-emerald-50',
                                'purple': isSelected ? 'bg-purple-500 text-white border-purple-600 shadow-md' : 'text-purple-600 border-purple-200 hover:bg-purple-50',
                                'pink': isSelected ? 'bg-pink-500 text-white border-pink-600 shadow-md' : 'text-pink-600 border-pink-200 hover:bg-pink-50',
                                'amber': isSelected ? 'bg-amber-500 text-white border-amber-600 shadow-md' : 'text-amber-600 border-amber-200 hover:bg-amber-50',
                                'rose': isSelected ? 'bg-rose-500 text-white border-rose-600 shadow-md' : 'text-rose-600 border-rose-200 hover:bg-rose-50',
                                'blue': isSelected ? 'bg-blue-500 text-white border-blue-600 shadow-md' : 'text-blue-600 border-blue-200 hover:bg-blue-50'
                            };
                            const activeClass = d.theme ? themeConfig[d.theme] : (isSelected ? 'bg-teal-500 text-white border-teal-600' : 'text-teal-600 border-teal-200');
                            return `
                            <li>
                                <button onclick="selectLearnTab('${d.id}')" id="ltab-${d.id}" class="w-full text-left px-5 py-4 text-lg md:text-xl font-bold rounded-full transition-all border-2 ${activeClass}">
                                    ${d.title}
                                </button>
                            </li>
                        `}).join('')}
                    </ul>
                </div>
                <div class="flex-1 p-4 md:p-6 lg:p-10 overflow-y-auto overflow-x-hidden w-full relative z-10" id="learn-content-area"></div>
            `;
            renderLearnContent();
        };

        window.selectLearnTab = (id) => {
            learnSubTab = id;
            renderLearnView(el('main-content')); 
            toggleLearnMenu(false);
        };

        window.renderLearnContent = () => {
            const area = el('learn-content-area');
            if(!area) return;
            const data = learnData.find(d => d.id === learnSubTab);
            area.innerHTML = `<div class="w-full max-w-[96%] xl:max-w-[98%] mx-auto animate-fade-in pb-12">${data.content}</div>`;
        };

        const renderQuizView = (container) => {
            if(!quizState.active) {
                container.innerHTML = `
                    <div class="w-full flex-1 flex items-center justify-center p-4 md:p-6 overflow-y-auto relative z-10">
                        <div class="glass-card p-8 md:p-12 rounded-[2.5rem] shadow-xl text-center max-w-4xl lg:max-w-5xl w-full border-2 border-dashed border-blue-300 relative overflow-hidden bg-white/95">
                            <div class="w-24 h-24 md:w-32 md:h-32 bg-blue-50 rounded-full mx-auto mb-8 flex items-center justify-center shadow-inner border border-blue-200">
                                <span class="text-6xl md:text-7xl">🎯</span>
                            </div>
                            <h2 class="text-3xl md:text-5xl font-extrabold mb-6 text-blue-600 tracking-wide">單元1 史前與原住民<br>48題 達人挑戰 🏆</h2>
                            <p class="text-blue-800/80 mb-10 text-xl md:text-2xl leading-loose">
                                從長濱文化到十三行，從平埔到高山族，驗收您的歷史精熟度！<br>
                                <span class="bg-blue-100 text-blue-800 font-bold px-5 py-2 rounded-full inline-block mt-6 border border-blue-200 shadow-sm">🌊 瀑布流模式</span><br>
                                <span class="text-lg md:text-xl text-rose-500 mt-3 block font-bold">🎯 點擊選項後，詳細解析將直接顯示在每個選項框框內，無須滑動對照！</span>
                            </p>
                            <button onclick="startQuiz()" class="w-full sm:w-auto bg-blue-500 hover:bg-blue-600 text-white font-bold py-5 px-16 text-2xl md:text-3xl rounded-full shadow-md transition-all transform hover:-translate-y-1 hover:shadow-lg">
                                開始挑戰 🚀🔥
                            </button>
                        </div>
                    </div>
                `;
            } else {
                renderQuizWaterfall(container);
            }
        };

        window.startQuiz = () => {
            initAudio(); // Explicitly init audio on button click
            const qList = [...generate120Questions()].map(q => ({
                ...q, selectedAns: null, showExplanation: false, isCorrect: false
            }));
            // If you want random order, uncomment the following line and comment the above line:
            // const qList = [...generate120Questions()].sort(() => 0.5 - Math.random()).map(q => ({ ...q, selectedAns: null, showExplanation: false, isCorrect: false }));
            quizState = { active: true, isFinished: false, questions: qList };
            saveQuizState();
            renderQuizView(el('main-content'));
            const navStats = el('nav-quiz-stats');
            if (navStats) { navStats.classList.remove('hidden'); navStats.classList.add('flex'); }
            updateQuizStats();
        };

        window.updateQuizStats = () => {
            if (!quizState.active) return;
            let correct = 0; let incorrect = 0; let answered = 0;
            const total = quizState.questions.length;
            quizState.questions.forEach(q => {
                if (q.showExplanation && q.selectedAns !== -1) {
                    answered++;
                    if (q.isCorrect) correct++; else incorrect++;
                }
            });
            const progressPercent = (answered / total) * 100;
            const elCorrect = document.getElementById('nav-stat-correct');
            const elIncorrect = document.getElementById('nav-stat-incorrect');
            const elBar = document.getElementById('nav-stat-progress-bar');
            if (elCorrect) elCorrect.innerText = correct;
            if (elIncorrect) elIncorrect.innerText = incorrect;
            if (elBar) elBar.style.width = progressPercent + '%';
        };

        window.restartQuizWithConfirm = () => {
            if(confirm('確定要重新開始挑戰嗎？這將會清除目前的畫面，並產生全新的測驗題目！')) startQuiz();
        };

        const renderQuizWaterfall = (container) => {
            const total = quizState.questions.length;
            const isFinished = quizState.isFinished;
            
            let headerHtml = isFinished 
                ? ` <div class="glass-card flex flex-col md:flex-row justify-between items-center rounded-3xl p-5 md:p-6 shadow-md border-2 border-dashed border-teal-300 mb-10 sticky top-0 z-50">
                        <div class="flex items-center mb-4 md:mb-0">
                            <span class="text-5xl mr-4 drop-shadow-sm">🏆✨</span>
                            <div>
                                <h2 class="text-2xl md:text-3xl font-extrabold text-teal-600">測驗結算完成 🎉</h2>
                                <p class="text-teal-700 font-bold text-lg mt-1">總分：<span class="text-3xl md:text-4xl text-teal-500 font-black">${quizState.scorePercent}</span> 分 (答對 ${quizState.correctCount} / 共 ${total} 題)</p>
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="switchTab('mistakes')" class="text-base md:text-lg text-amber-600 hover:bg-amber-50 px-4 py-2 rounded-full font-bold transition-colors flex items-center border-2 border-amber-200 bg-white shadow-sm"><span class="mr-2">🩹</span>前往錯題本</button>
                            <button onclick="restartQuizWithConfirm()" class="text-base md:text-lg text-white bg-teal-500 hover:bg-teal-600 px-4 py-2 rounded-full font-bold transition-colors flex items-center shadow-md"><span class="mr-2">🔄</span>重新挑戰</button>
                        </div>
                    </div>`
                : ` <div class="flex justify-end mb-4">
                        <button onclick="clearQuizHistory()" class="text-sm md:text-base text-rose-500 hover:text-white hover:bg-rose-400 px-4 py-2 rounded-full font-bold transition-colors flex items-center border-2 border-rose-200 bg-white shadow-sm"><span class="mr-2">🚪</span>放棄作答</button>
                    </div>`;

            let html = `
                <div class="w-full flex-1 p-3 md:p-6 lg:p-10 overflow-y-auto overflow-x-hidden pb-24 scrollbar-hide relative z-10" id="quiz-scroll-container">
                    <div class="w-full max-w-[96%] xl:max-w-[98%] mx-auto relative">
                        ${headerHtml}
                        <div id="questions-list" class="space-y-10 w-full">
            `;
            quizState.questions.forEach((_, qIdx) => { html += `<div id="q-block-${qIdx}" class="bg-white rounded-[2rem] shadow-sm overflow-hidden border-2 border-dashed border-blue-200 transition-all w-full p-2">${generateSingleQuestionHtml(qIdx)}</div>`; });
            html += `</div>`;
            
            if (!isFinished) {
                html += `
                        <button onclick="finishQuizWaterfall()" class="w-full mt-16 bg-blue-500 hover:bg-blue-600 text-white font-extrabold py-6 md:py-8 text-2xl md:text-4xl rounded-full shadow-md transition-all transform hover:-translate-y-1 flex items-center justify-center break-words border-b-4 border-blue-700">
                            🏁 完成測驗並結算成績 📊🎉
                        </button>`;
            } else {
                 html += `
                        <button onclick="restartQuizWithConfirm()" class="w-full mt-16 bg-teal-500 hover:bg-teal-600 text-white font-extrabold py-6 md:py-8 text-2xl md:text-4xl rounded-full shadow-md transition-all transform hover:-translate-y-1 flex items-center justify-center break-words border-b-4 border-teal-700">
                            🔄 重新開始挑戰 🚀💪
                        </button>`;                
            }
            html += `</div></div>`;
            container.innerHTML = html;
        };

        const generateSingleQuestionHtml = (qIdx) => {
            const q = quizState.questions[qIdx];
            let optionsHtml = '';
            
            q.opts.forEach((opt, i) => {
                let btnClass = "w-full text-left p-3 md:p-5 text-xl md:text-2xl rounded-[1.5rem] border-2 transition-all duration-200 flex flex-col items-start group relative overflow-hidden ";
                let iconHtml = `<span class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center mr-3 md:mr-5 font-extrabold text-xl md:text-2xl transition-colors shrink-0 shadow-inner group-hover:bg-blue-100 group-hover:text-blue-700 border border-blue-100">${String.fromCharCode(65+i)}</span>`;
                
                let optExpHtml = '';
                
                if (!q.showExplanation) {
                    btnClass += "border-blue-100 hover:border-blue-400 hover:bg-blue-50/50 bg-white cursor-pointer hover:shadow-sm";
                } else {
                    let expText = (q.exps && q.exps[i]) ? q.exps[i] : '無詳細解析';
                    
                    if (i === q.ans) {
                        btnClass += "border-emerald-400 bg-emerald-50/50 text-emerald-800 shadow-sm z-10";
                        iconHtml = `<span class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-emerald-500 text-white flex items-center justify-center mr-3 md:mr-5 font-bold text-2xl md:text-3xl shrink-0 shadow-sm border border-emerald-600">✅</span>`;
                        optExpHtml = `<div class="mt-3 p-3 md:p-4 rounded-[1rem] text-base md:text-lg border border-emerald-200 bg-white text-emerald-800 animate-fade-in w-full leading-relaxed font-medium"><span class="font-bold mr-2 text-emerald-600">🎯 解析：</span>${expText}</div>`;
                    } else if (i === q.selectedAns) {
                        btnClass += "border-rose-400 bg-rose-50/50 text-rose-800";
                        iconHtml = `<span class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-rose-500 text-white flex items-center justify-center mr-3 md:mr-5 font-bold text-2xl md:text-3xl shrink-0 shadow-sm border border-rose-600">❌</span>`;
                        optExpHtml = `<div class="mt-3 p-3 md:p-4 rounded-[1rem] text-base md:text-lg border border-rose-200 bg-white text-rose-800 animate-fade-in w-full leading-relaxed font-medium"><span class="font-bold mr-2 text-rose-600">💡 解析：</span>${expText}</div>`;
                    } else {
                        btnClass += "border-slate-200 bg-slate-50/50 opacity-80 cursor-not-allowed";
                        iconHtml = `<span class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center mr-3 md:mr-5 font-extrabold text-xl md:text-2xl shrink-0 border border-slate-300">${String.fromCharCode(65+i)}</span>`;
                        optExpHtml = `<div class="mt-3 p-3 md:p-4 rounded-[1rem] text-base md:text-lg border border-slate-200 bg-white text-slate-600 animate-fade-in w-full leading-relaxed font-medium"><span class="font-bold mr-2 text-slate-400">💡 解析：</span>${expText}</div>`;
                    }
                }

                optionsHtml += `
                    <button ${q.showExplanation ? 'disabled' : `onclick="answerWaterfallQuestion(${qIdx}, ${i})"`} class="${btnClass}">
                        <div class="flex items-center w-full">
                            ${iconHtml}
                            <span class="flex-1 leading-relaxed break-words z-10 text-left ${q.showExplanation && i === q.ans ? 'text-emerald-700 font-bold' : 'text-slate-700 font-medium'}">${opt}</span>
                        </div>
                        ${optExpHtml}
                    </button>
                `;
            });

            let generalExpHtml = '';
            if (q.showExplanation && q.generalExp) {
                generalExpHtml = `
                    <div class="mt-5 p-4 md:p-5 bg-blue-50 border-2 border-dashed border-blue-200 rounded-[1.5rem] relative overflow-hidden animate-fade-in text-left shadow-sm">
                        <p class="text-lg md:text-xl leading-loose break-words whitespace-pre-wrap font-bold text-blue-800"><span class="mr-2">📝 重點補充：</span>${q.generalExp}</p>
                    </div>
                `;
            }

            const isFav = userData.favorites && userData.favorites.includes(q.q);
            const favIconHtml = isFav 
                ? '<i class="fa-solid fa-heart text-rose-500 drop-shadow-sm"></i>' 
                : '<i class="fa-regular fa-heart text-slate-300 hover:text-rose-400 drop-shadow-sm"></i>';

            let statusTag = '';
            let bgGradient = '';
            if (q.showExplanation) {
                if (q.selectedAns === q.ans) {
                    statusTag = '<span class="text-emerald-600 font-bold text-lg md:text-xl flex items-center bg-emerald-50 px-4 py-1.5 rounded-full border border-emerald-200 shadow-sm"><span class="mr-2">✅</span>答對 🎉</span>';
                    bgGradient = 'bg-emerald-50/30';
                } else if (q.selectedAns === -1) {
                    statusTag = '<span class="text-amber-600 font-bold text-lg md:text-xl flex items-center bg-amber-50 px-4 py-1.5 rounded-full border border-amber-200 shadow-sm"><span class="mr-2">⚠️</span>未作答</span>';
                    bgGradient = 'bg-amber-50/30';
                } else {
                    statusTag = '<span class="text-rose-600 font-bold text-lg md:text-xl flex items-center bg-rose-50 px-4 py-1.5 rounded-full border border-rose-200 shadow-sm"><span class="mr-2">❌</span>答錯 💦</span>';
                    bgGradient = 'bg-rose-50/30';
                }
            } else {
                statusTag = '<span class="text-blue-500 font-bold text-base md:text-lg flex items-center bg-blue-50 px-4 py-1.5 rounded-full border border-blue-200 shadow-sm"><span class="mr-2">✍️</span>作答區</span>';
                bgGradient = 'bg-white';
            }

            return `
                <div class="px-5 md:px-8 py-4 border-b-2 border-dashed border-blue-100 flex justify-between items-center transition-colors rounded-t-[2rem] ${bgGradient}">
                    <div class="flex items-center">
                        <span class="font-extrabold text-blue-600 text-lg md:text-xl bg-white px-4 py-1.5 rounded-full border-2 border-blue-200 shadow-sm">🤔 Q ${qIdx + 1}</span>
                        <button onclick="toggleQuizFavorite(${qIdx})" class="ml-4 text-[1.8rem] md:text-4xl hover:scale-110 transition-transform focus:outline-none" title="加入/取消最愛">
                            ${favIconHtml}
                        </button>
                    </div>
                    ${statusTag}
                </div>
                <div class="p-5 md:p-8 w-full overflow-hidden">
                    <h3 class="text-2xl md:text-3xl font-extrabold text-slate-800 mb-6 leading-loose break-words text-left">${q.q}</h3>
                    <div class="space-y-3 w-full">
                        ${optionsHtml}
                    </div>
                    ${generalExpHtml}
                </div>
            `;
        };

        window.toggleQuizFavorite = (qIdx) => {
            const q = quizState.questions[qIdx];
            const qText = q.q;
            if (!userData.favorites) userData.favorites = [];
            const idx = userData.favorites.indexOf(qText);
            if (idx > -1) userData.favorites.splice(idx, 1);
            else userData.favorites.push(qText);
            saveUserDataToCloud();
            const block = document.getElementById(`q-block-${qIdx}`);
            if (block) block.innerHTML = generateSingleQuestionHtml(qIdx);
        };

        window.answerWaterfallQuestion = (qIdx, optIdx) => {
            const q = quizState.questions[qIdx];
            if(q.showExplanation) return; 

            const isCorrect = optIdx === q.ans;
            q.selectedAns = optIdx;
            q.showExplanation = true;
            q.isCorrect = isCorrect;
            
            if (isCorrect) {
                playCorrectSound();
                confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 }, zIndex: 10000, colors: ['#3b82f6', '#60a5fa', '#93c5fd', '#bfdbfe', '#dbeafe'] });
            } else {
                playWrongSound();
                const mistakeId = q.q; 
                if(!userData.mistakes) userData.mistakes = [];
                const exists = userData.mistakes.find(m => m.id === mistakeId);
                if(!exists) {
                    userData.mistakes.push({
                        id: mistakeId, q: q.q, opts: q.opts, ans: q.ans, exps: q.exps, generalExp: q.generalExp, time: new Date().toISOString()
                    });
                    saveUserDataToCloud();
                }
            }
            saveQuizState();
            const block = document.getElementById(`q-block-${qIdx}`);
            if (block) block.innerHTML = generateSingleQuestionHtml(qIdx);
            updateQuizStats();
        };

        window.finishQuizWaterfall = async () => {
            let correctCount = 0; let answeredCount = 0;
            quizState.questions.forEach(q => {
                if (q.showExplanation && q.selectedAns !== -1) {
                    answeredCount++;
                    if (q.isCorrect) correctCount++;
                }
            });
            if (answeredCount < quizState.questions.length) {
                if(!confirm(`您還有 ${quizState.questions.length - answeredCount} 題尚未作答，確定要直接交卷結算嗎？未作答的題目將以錯誤計算。`)) return;
            }
            quizState.questions.forEach(q => {
                if (!q.showExplanation) {
                    q.showExplanation = true; q.isCorrect = false; q.selectedAns = -1;
                }
            });
            quizState.isFinished = true; quizState.correctCount = correctCount; quizState.answeredCount = answeredCount;
            const total = quizState.questions.length;
            const scorePercent = Math.round((correctCount / total) * 100);
            quizState.scorePercent = scorePercent;
            saveQuizState();
            
            if (!userData.quizHistory) userData.quizHistory = [];
            userData.quizHistory.push({ date: new Date().toLocaleString(), score: scorePercent, total: total, correct: correctCount });
            if (userData.quizHistory.length > 50) userData.quizHistory = userData.quizHistory.slice(-50);
            saveUserDataToCloud();

            renderQuizView(document.getElementById('main-content'));
            confetti({ particleCount: 300, spread: 100, origin: { y: 0.3 }, zIndex: 10000, colors: ['#3b82f6', '#60a5fa', '#93c5fd', '#bfdbfe', '#dbeafe'] });
            
            setTimeout(() => {
                const scrollContainer = document.getElementById('quiz-scroll-container');
                if (scrollContainer) scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
            }, 100);
        };

        window.clearQuizHistory = () => {
            if(confirm('警告：確定要清除目前的作答紀錄嗎？\n(此動作將會遺失目前所有測驗進度)')) {
                if(confirm('【第二次確認】真的要清除作答紀錄並放棄目前測驗嗎？\n按下「確定」將會清空並返回測驗首頁。')) {
                    quizState = { active: false, currentQ: 0, score: 0, answers: [], questions: [], showExplanation: false, selectedAns: null };
                    saveQuizState();
                    const navStats = document.getElementById('nav-quiz-stats');
                    if (navStats) { navStats.classList.add('hidden'); navStats.classList.remove('flex'); }
                    renderQuizView(document.getElementById('main-content'));
                }
            }
        };

        window.renderMistakes = (container) => {
            if(!container) container = document.getElementById('main-content');
            if(!userData.mistakes || userData.mistakes.length === 0) {
                container.innerHTML = `
                    <div class="w-full flex-1 flex items-center justify-center p-4 md:p-6 text-amber-500 flex-col text-center relative z-10 animate-fade-in">
                        <div class="w-40 h-40 bg-white rounded-full flex items-center justify-center mb-8 shadow-sm border-4 border-dashed border-amber-200 text-7xl">🥳</div>
                        <h2 class="text-4xl md:text-5xl font-extrabold text-amber-600 mb-4">太棒了！✨</h2>
                        <p class="text-2xl md:text-3xl font-bold text-amber-500/80">目前沒有任何錯題紀錄 🎉</p>
                    </div>`;
                return;
            }

            container.innerHTML = `
                <div class="w-full flex-1 p-3 md:p-6 lg:p-10 overflow-y-auto overflow-x-hidden pb-24 relative z-10">
                    <div class="w-full max-w-[96%] xl:max-w-[98%] mx-auto">
                        <div class="flex justify-between items-end border-b-4 border-dashed border-amber-200 pb-5 mb-12">
                            <div>
                                <h2 class="text-4xl md:text-5xl font-extrabold text-amber-600 flex items-center"><span class="bg-white text-amber-500 w-14 h-14 flex items-center justify-center rounded-full border-2 border-amber-200 mr-5 shadow-sm">🩹</span>錯題本 📚</h2>
                                <p class="text-amber-600/70 mt-3 ml-20 font-bold text-lg md:text-xl">收錄您在測驗中答錯的題目，溫故知新 🔄💡</p>
                            </div>
                            <button onclick="clearMistakes()" class="text-base md:text-xl text-amber-500 hover:text-white bg-white hover:bg-amber-400 px-5 py-3 rounded-full border-2 border-amber-200 shadow-sm font-bold transition-all flex items-center shrink-0 mb-2"><span class="mr-2">🗑️</span>清空</button>
                        </div>
                        <div class="space-y-10 md:space-y-12 w-full">
                            ${userData.mistakes.map((m, i) => `
                                <div class="bg-white p-6 md:p-10 rounded-[2.5rem] shadow-sm border-2 border-dashed border-amber-200 w-full overflow-hidden relative group">
                                    <h3 class="font-extrabold text-slate-800 mb-6 text-2xl md:text-3xl break-words leading-loose flex items-start text-left">
                                        <span class="text-amber-500 mr-3 text-2xl font-black bg-amber-50 px-4 py-1.5 rounded-full border border-amber-200">🤔 Q</span>${m.q}
                                    </h3>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-5 text-xl md:text-2xl w-full font-medium text-left">
                                        ${m.opts.map((opt, idx) => `
                                            <div class="p-4 md:p-5 rounded-2xl break-words transition-all flex flex-col ${idx === m.ans ? 'bg-emerald-50 text-emerald-800 font-bold border-2 border-emerald-400 shadow-sm' : 'bg-slate-50 text-slate-600 border border-slate-200'}">
                                                <div class="flex items-start">
                                                    <span class="inline-block w-8 md:w-10 font-bold ${idx === m.ans ? 'text-emerald-600' : 'text-slate-400'}">${String.fromCharCode(65+idx)}.</span> 
                                                    <span class="flex-1">${opt}</span>
                                                    ${idx === m.ans ? '<span class="ml-2 text-emerald-500 text-2xl">✅</span>' : ''}
                                                </div>
                                                ${(m.exps && m.exps[idx]) ? `<div class="mt-3 p-3 rounded-xl text-base md:text-lg border ${idx === m.ans ? 'border-emerald-200 bg-white text-emerald-700' : 'border-slate-200 bg-white text-slate-600'} leading-relaxed font-medium"><span class="font-bold mr-2 ${idx === m.ans ? 'text-emerald-600' : 'text-slate-500'}">${idx === m.ans ? '🎯 解析：' : '💡 解析：'}</span>${m.exps[idx]}</div>` : ''}
                                            </div>
                                        `).join('')}
                                    </div>
                                    ${m.generalExp ? `
                                    <div class="mt-5 p-4 md:p-5 bg-amber-50 border-2 border-dashed border-amber-200 rounded-2xl relative overflow-hidden animate-fade-in text-left shadow-sm">
                                        <p class="text-lg md:text-xl leading-loose break-words whitespace-pre-wrap font-bold text-amber-800"><span class="mr-2">📝 重點補充：</span>${m.generalExp}</p>
                                    </div>` : ''}
                                </div>
                            `).reverse().join('')}
                        </div>
                    </div>
                </div>
            `;
        };

        window.clearMistakes = () => {
            if(confirm('警告：確定要清空所有錯題紀錄嗎？\n(此動作無法復原)')) {
                if(confirm('【第二次確認】真的要徹底清空錯題本嗎？\n按下「確定」將會刪除所有錯題資料。')) {
                    userData.mistakes = []; saveUserDataToCloud(); renderMistakes();
                }
            }
        };

        window.renderFavorites = (container) => {
            if(!container) container = document.getElementById('main-content');
            if(!userData.favorites || userData.favorites.length === 0) {
                container.innerHTML = `
                    <div class="w-full flex-1 flex items-center justify-center p-4 md:p-6 text-rose-400 flex-col text-center relative z-10 animate-fade-in">
                        <div class="w-40 h-40 bg-white rounded-full flex items-center justify-center mb-8 shadow-sm border-4 border-dashed border-rose-200 text-7xl">💔</div>
                        <h2 class="text-4xl md:text-5xl font-extrabold text-rose-500 mb-4">暫無收藏</h2>
                        <p class="text-2xl md:text-3xl font-bold text-rose-400/80 mb-10">在測驗中點擊愛心圖示即可收藏題目！ 📌✨</p>
                        <button onclick="switchTab('quiz')" class="bg-rose-400 hover:bg-rose-500 text-white font-bold px-10 py-4 text-xl rounded-full shadow-md transition-colors">🚀 前往測驗</button>
                    </div>`;
                return;
            }

            const allQList = generate120Questions();
            const favQuestions = userData.favorites.map(favText => {
                return allQList.find(q => q.q === favText) || { q: favText, opts: [], ans: 0, exps: [], generalExp: '題目資料已遺失' };
            });

            container.innerHTML = `
                <div class="w-full flex-1 p-3 md:p-6 lg:p-10 overflow-y-auto overflow-x-hidden pb-24 relative z-10">
                    <div class="w-full max-w-[96%] xl:max-w-[98%] mx-auto">
                        <div class="flex items-end border-b-4 border-dashed border-rose-200 pb-5 mb-12">
                            <h2 class="text-4xl md:text-5xl font-extrabold text-rose-500 flex items-center"><span class="bg-white text-rose-500 w-14 h-14 flex items-center justify-center rounded-full border-2 border-rose-200 mr-5 shadow-sm">💖</span>我的最愛 🌟</h2>
                            <p class="text-rose-400/80 mt-3 ml-8 font-bold text-lg md:text-xl hidden sm:block mb-1">您專屬的重點筆記收藏夾 🎒✨</p>
                        </div>
                        <div class="space-y-10 md:space-y-12 w-full">
                            ${favQuestions.map((qObj, i) => {
                                if (qObj.opts.length === 0) return '';
                                return `
                                <div class="bg-white p-6 md:p-10 rounded-[2.5rem] shadow-sm border-2 border-dashed border-rose-200 w-full overflow-hidden relative group">
                                    <div class="flex justify-between items-start mb-6">
                                        <h3 class="font-extrabold text-slate-800 text-2xl md:text-3xl break-words leading-loose flex items-start pr-6 flex-1 text-left">
                                            <span class="text-rose-500 mr-3 text-2xl font-black bg-rose-50 px-4 py-1.5 rounded-full border border-rose-200">📌 Q</span>${qObj.q}
                                        </h3>
                                        <button onclick="toggleFavoritePage('${qObj.q}')" class="text-[2.2rem] md:text-4xl hover:scale-110 transition-transform shrink-0 mt-1 focus:outline-none" title="移除最愛">
                                            <i class="fa-solid fa-heart text-rose-400 drop-shadow-sm"></i>
                                        </button>
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-5 text-xl md:text-2xl w-full font-medium text-left">
                                        ${qObj.opts.map((opt, idx) => `
                                            <div class="p-4 md:p-5 rounded-2xl break-words transition-all flex flex-col ${idx === qObj.ans ? 'bg-emerald-50 text-emerald-800 font-bold border-2 border-emerald-400 shadow-sm' : 'bg-slate-50 text-slate-600 border border-slate-200'}">
                                                <div class="flex items-start">
                                                    <span class="inline-block w-8 md:w-10 font-bold ${idx === qObj.ans ? 'text-emerald-600' : 'text-slate-400'}">${String.fromCharCode(65+idx)}.</span> 
                                                    <span class="flex-1">${opt}</span>
                                                    ${idx === qObj.ans ? '<span class="ml-2 text-emerald-500 text-2xl">✅</span>' : ''}
                                                </div>
                                                ${(qObj.exps && qObj.exps[idx]) ? `<div class="mt-3 p-3 rounded-xl text-base md:text-lg border ${idx === qObj.ans ? 'border-emerald-200 bg-white text-emerald-700' : 'border-slate-200 bg-white text-slate-600'} leading-relaxed font-medium"><span class="font-bold mr-2 ${idx === qObj.ans ? 'text-emerald-600' : 'text-slate-500'}">${idx === qObj.ans ? '🎯 解析：' : '💡 解析：'}</span>${qObj.exps[idx]}</div>` : ''}
                                            </div>
                                        `).join('')}
                                    </div>
                                    ${qObj.generalExp ? `
                                    <div class="mt-5 p-4 md:p-5 bg-rose-50 border-2 border-dashed border-rose-200 rounded-2xl relative overflow-hidden animate-fade-in text-left shadow-sm">
                                        <p class="text-lg md:text-xl leading-loose break-words whitespace-pre-wrap font-bold text-rose-800"><span class="mr-2">📝 重點補充：</span>${qObj.generalExp}</p>
                                    </div>` : ''}
                                </div>
                                `;
                            }).reverse().join('')}
                        </div>
                    </div>
                </div>
            `;
        };

        window.toggleFavoritePage = (qText) => {
            if (!userData.favorites) return;
            const idx = userData.favorites.indexOf(qText);
            if (idx > -1) {
                if(confirm('確定要從最愛中移除此題嗎？')) {
                    userData.favorites.splice(idx, 1);
                    saveUserDataToCloud();
                    renderFavorites();
                }
            }
        };

        window.renderHistory = (container) => {
            if(!container) container = document.getElementById('main-content');
            if((!userData.quizHistory || userData.quizHistory.length === 0) && (!userData.loginHistory || userData.loginHistory.length === 0)) {
                container.innerHTML = `
                    <div class="w-full flex-1 flex items-center justify-center p-4 md:p-6 text-purple-400 flex-col text-center relative z-10 animate-fade-in">
                        <div class="w-40 h-40 bg-white rounded-full flex items-center justify-center mb-8 shadow-sm border-4 border-dashed border-purple-200 text-7xl">📜</div>
                        <h2 class="text-4xl md:text-5xl font-extrabold text-purple-500 mb-4">暫無紀錄</h2>
                        <p class="text-2xl md:text-3xl font-bold text-purple-400/80 mb-10">您還沒有完成任何測驗或留下足跡喔！</p>
                        <button onclick="switchTab('quiz')" class="bg-purple-400 hover:bg-purple-500 text-white font-bold px-10 py-4 text-xl rounded-full shadow-md transition-colors">🚀 前往測驗</button>
                    </div>`;
                return;
            }

            container.innerHTML = `
                <div class="w-full flex-1 p-3 md:p-6 lg:p-10 overflow-y-auto overflow-x-hidden pb-24 relative z-10">
                    <div class="w-full max-w-[96%] xl:max-w-[98%] mx-auto">
                        <div class="flex justify-between items-end border-b-4 border-dashed border-purple-200 pb-5 mb-12">
                            <div>
                                <h2 class="text-4xl md:text-5xl font-extrabold text-purple-600 flex items-center"><span class="bg-white text-purple-500 w-14 h-14 flex items-center justify-center rounded-full border-2 border-purple-200 mr-5 shadow-sm">📜</span>作答與登入紀錄</h2>
                                <p class="text-purple-500/70 mt-3 ml-20 font-bold text-lg md:text-xl">追蹤您的學習軌跡，跨裝置同步更新 ☁️</p>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                            <!-- 作答紀錄 -->
                            <div class="bg-white rounded-[2rem] shadow-sm border-2 border-dashed border-purple-200 overflow-hidden">
                                <div class="bg-purple-50 p-6 border-b-2 border-dashed border-purple-200">
                                    <h3 class="text-3xl font-bold text-purple-700 flex items-center"><span class="mr-3 text-3xl">🎯</span>最近作答成績</h3>
                                </div>
                                <div class="p-6 md:p-8 space-y-5 max-h-[60vh] overflow-y-auto">
                                    ${(userData.quizHistory || []).slice().reverse().map((h, i) => `
                                        <div class="flex justify-between items-center p-5 rounded-2xl border-2 ${h.score >= 80 ? 'bg-emerald-50/50 border-emerald-200' : (h.score < 60 ? 'bg-rose-50/50 border-rose-200' : 'bg-slate-50 border-slate-200')} transition-all hover:shadow-sm">
                                            <div>
                                                <div class="font-bold text-slate-700 text-xl md:text-2xl">${h.date}</div>
                                                <div class="text-lg text-slate-500 mt-2 font-medium">共 ${h.total} 題，答對 <span class="font-bold text-slate-600">${h.correct}</span> 題</div>
                                            </div>
                                            <div class="text-5xl font-black ${h.score >= 80 ? 'text-emerald-500' : (h.score < 60 ? 'text-rose-500' : 'text-amber-500')}">${h.score}<span class="text-2xl ml-1 font-bold">分</span></div>
                                        </div>
                                    `).join('') || '<p class="text-xl text-purple-300 text-center py-10 font-bold">目前還沒有測驗紀錄喔</p>'}
                                </div>
                            </div>

                            <!-- 登入紀錄 -->
                            <div class="bg-white rounded-[2rem] shadow-sm border-2 border-dashed border-indigo-200 overflow-hidden h-fit">
                                <div class="bg-indigo-50 p-6 border-b-2 border-dashed border-indigo-200">
                                    <h3 class="text-3xl font-bold text-indigo-700 flex items-center"><span class="mr-3 text-3xl">👣</span>最近登入足跡</h3>
                                </div>
                                <div class="p-6 md:p-8 space-y-4 max-h-[40vh] overflow-y-auto">
                                    ${(userData.loginHistory || []).slice().reverse().map((time, i) => `
                                        <div class="flex items-center p-4 rounded-xl border border-indigo-100 bg-white hover:bg-indigo-50 transition-colors shadow-sm">
                                            <span class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-500 mr-4 text-lg font-bold border border-indigo-200">${i+1}</span>
                                            <span class="font-bold text-slate-600 text-xl">${new Date(time).toLocaleString()}</span>
                                        </div>
                                    `).join('') || '<p class="text-xl text-indigo-300 text-center py-10 font-bold">無登入紀錄</p>'}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        initApp();

    </script>
</body>
</html>
