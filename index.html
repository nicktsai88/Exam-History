<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史會考衝刺</title>
    <!-- 加入可愛圓潤的英文字型 Nunito 與黑體/明體 -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Import Map for Firebase -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
        }
      }
    </script>

    <style>
        :root {
            --text-main: #4e342e;
            --card-bg: #ffffff;
        }

        /* 可愛粉彩圓點背景 */
        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: #fff9f9;
            background-image: 
                radial-gradient(#ffc0cb 3px, transparent 3px), 
                radial-gradient(#a2d5f2 3px, transparent 3px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: var(--text-main);
        }

        h1, h2, .font-serif { font-family: 'Noto Serif TC', serif; }

        .header {
            text-align: center;
            margin-bottom: 50px;
            max-width: 900px;
            position: relative;
        }

        /* 超可愛立體標題 */
        .header h1 {
            color: #ff6b81;
            font-size: 4em; 
            font-weight: 900; 
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 4px 4px 0px #ffffff, 8px 8px 0px #ffeaa7;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #c0392b;
            padding: 15px 40px;
            border-radius: 9999px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.4em;
            border: 4px solid #fff;
            box-shadow: 0 6px 0 #ffb8b8;
            transition: all 0.2s ease;
            margin-top: 20px;
        }
        .home-btn:hover { 
            transform: translateY(4px); 
            box-shadow: 0 2px 0 #ffb8b8; 
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1300px;
            margin-bottom: 50px;
        }

        /* 圓潤泡泡風格的卡片 */
        .app-card {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 25px 20px 20px 20px;
            text-decoration: none;
            color: #333;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            min-height: 350px;
        }

        .app-card:hover {
            transform: translateY(-8px);
        }

        .app-card.completed {
            transform: scale(1.02);
        }

        .card-icon-wrapper {
            font-size: 3em;
            margin-bottom: 15px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 1.3em;
            font-weight: 900;
            margin-bottom: 15px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            border: 2px solid #fff;
        }
        .status-loading { background-color: #fdd835; box-shadow: 0 0 8px #fdd835; }
        .status-success { background-color: #4caf50; box-shadow: 0 0 8px #4caf50; }
        .status-error { background-color: #ef5350; box-shadow: 0 0 8px #ef5350; }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.8); }
            50% { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-bounce-in { animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* 可愛分類大標題 */
        .section-divider-container {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px 0 30px 0;
            position: relative;
        }
        
        .section-divider {
            background: #fff;
            padding: 12px 40px;
            border-radius: 50px;
            border: 4px solid #ffeaa7;
            box-shadow: 0 6px 0 #ffeaa7;
            color: #d35400;
            font-size: 2em;
            font-weight: 900;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .section-divider-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 4px;
            background: repeating-linear-gradient(90deg, #ffeaa7, #ffeaa7 10px, transparent 10px, transparent 20px);
            z-index: 1;
        }

        .quick-user-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            border: 3px solid #ffb8b8;
            color: #d63031;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1.1em;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #ffb8b8;
        }
        .quick-user-btn:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ffb8b8;
            background: #fff0f0;
        }
        
        /* 隱藏預設捲軸，讓介面更乾淨 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fff9f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #ffc0cb; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff9a9e; 
        }

    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "firebase/app";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot, arrayUnion } from "firebase/firestore";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "firebase/auth";

        // ==========================================
        // 1. Firebase Config
        // ==========================================
        
        const firebaseConfig = {
            apiKey: "AIzaSyAxQFt76ZPXE7d0i1XeNZ1yiiD2WYNIfHs",
            authDomain: "chinese-learning-47f4d.firebaseapp.com",
            projectId: "chinese-learning-47f4d",
            storageBucket: "chinese-learning-47f4d.firebasestorage.app",
            messagingSenderId: "76289812052",
            appId: "1:76289812052:web:898384a916f9f341f62fc1"
        };

        const COLLECTION_NAME = 'Exam-History'; 
        const DOC_GLOBAL = 'global';

        let app, db, auth;

        try {
            if (firebaseConfig.apiKey) {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
            }
        } catch (e) {
            console.error("Firebase init failed:", e);
        }

        // ==========================================
        // 2. Data Structure (14 Categories for History with Array Contents)
        // ==========================================
        const generateRawData = () => {
            return [
                {
                    title: "臺灣史",
                    icon: "🏝️",
                    items: [
                        { id: 1, code: "Exam-History-1", title: "單元1：史前文化與臺灣原住民", color: "#2ed573", lightColor: "#e8f5e9", icon: "🦕", href: "Exam-History-1.html", contents: ["(1) 歷史的基礎觀念", "(2) 臺灣的史前文化", "(3) 臺灣的原住民"] },
                        { id: 2, code: "Exam-History-2", title: "單元2：大航海時代的臺灣", color: "#1e90ff", lightColor: "#e1f5fe", icon: "⛵", href: "Exam-History-2.html", contents: ["(1) 東亞海域的各方勢力", "(2) 荷蘭人治臺", "(3) 鄭氏政權治臺", "(4) 原住民與外來者的互動"] },
                        { id: 3, code: "Exam-History-3", title: "單元3：清帝國時期的臺灣", color: "#ffa502", lightColor: "#fff3e0", icon: "📜", href: "Exam-History-3.html", contents: ["(1) 清帝國的統治政策", "(2) 農、商業的發展", "(3) 漢人社會的活動", "(4) 原住民的社會文化變遷"] },
                        { id: 4, code: "Exam-History-4", title: "單元4：日本帝國時期的臺灣", color: "#ff4757", lightColor: "#ffebee", icon: "🚂", href: "Exam-History-4.html", contents: ["(1) 殖民體制的建立", "(2) 統治政策的轉變", "(3) 日治時期的經濟發展", "(4) 現代教育與社會運動", "(5) 新舊文化的交替與衝擊"] },
                        { id: 5, code: "Exam-History-5", title: "單元5：當代臺灣", color: "#9b59b6", lightColor: "#f3e5f5", icon: "🏙️", href: "Exam-History-5.html", contents: ["(1) 政權轉換與二二八事件", "(2) 從戒嚴體制到政治民主化", "(3) 外交局勢與兩岸關係", "(4) 經濟發展及其影響", "(5) 社會文化的變遷"] }
                    ]
                },
                {
                    title: "中國與東亞史",
                    icon: "🐉",
                    items: [
                        { id: 6, code: "Exam-History-6", title: "單元6：商周至隋唐時期", color: "#1abc9c", lightColor: "#e0f2f1", icon: "🏺", href: "Exam-History-6.html", contents: ["(1) 從封建到帝國", "(2) 帝制國家的選才制度", "(3) 商周至隋唐的民族互動", "(4) 商周至隋唐的文化交流"] },
                        { id: 7, code: "Exam-History-7", title: "單元7：宋、元至盛清時期", color: "#f1c40f", lightColor: "#fffde7", icon: "💴", href: "Exam-History-7.html", contents: ["(1) 宋元時期的國際互動", "(2) 宋元時期的商貿與文化交流", "(3) 明清時期中國的政局變遷", "(4) 明清時期東亞的國際秩序", "(5) 明清時期東亞的商貿活動與文化交流"] },
                        { id: 8, code: "Exam-History-8", title: "單元8：晚清時期", color: "#576574", lightColor: "#e8eaf6", icon: "⚓", href: "Exam-History-8.html", contents: ["(1) 晚清時期東西方的接觸與衝突", "(2) 東亞各地對西力衝擊的回應", "(3) 甲午戰爭後的制度改革", "(4) 晚清社會文化的變遷"] },
                        { id: 9, code: "Exam-History-9", title: "單元9：現代國家的興起", color: "#e84393", lightColor: "#fce4ec", icon: "🏭", href: "Exam-History-9.html", contents: ["(1) 中華民國的建立與早期發展", "(2) 舊傳統與新思潮的激盪", "(3) 現代國家的建置", "(4) 日本帝國的對外擴張與衝擊"] },
                        { id: 10, code: "Exam-History-10", title: "單元10：當代東亞的局勢", color: "#00cec9", lightColor: "#e0f7fa", icon: "🤝", href: "Exam-History-10.html", contents: ["(1) 國共內戰", "(2) 中華人民共和國的建立與發展", "(3) 冷戰時期東亞國家間的競合", "(4) 東南亞地區國際組織的發展"] }
                    ]
                },
                {
                    title: "世界史",
                    icon: "🌍",
                    items: [
                        { id: 11, code: "Exam-History-11", title: "單元11：古代文化的遺產", color: "#e67e22", lightColor: "#fff8e1", icon: "🏛️", href: "Exam-History-11.html", contents: ["(1) 西亞與非洲的古文明", "(2) 希臘、羅馬的政治與文化", "(3) 普世宗教的起源與發展"] },
                        { id: 12, code: "Exam-History-12", title: "單元12：近代世界的變革", color: "#7bed9f", lightColor: "#f1f8e9", icon: "⚙️", href: "Exam-History-12.html", contents: ["(1) 近代歐洲的興起", "(2) 多元世界的互動", "(3) 理性思維的開展", "(4) 工業革命"] },
                        { id: 13, code: "Exam-History-13", title: "單元13：現代國家與帝國主義的發展", color: "#8e44ad", lightColor: "#ede7f6", icon: "🧭", href: "Exam-History-13.html", contents: ["(1) 美國獨立與法國大革命", "(2) 民族主義與國家建立", "(3) 帝國主義的再擴張", "(4) 第一次世界大戰與戰後秩序重建"] },
                        { id: 14, code: "Exam-History-14", title: "單元14：第二次大戰與戰後秩序", color: "#0984e3", lightColor: "#e3f2fd", icon: "🕊️", href: "Exam-History-14.html", contents: ["(1) 戰間期的世界局勢", "(2) 第二次世界大戰", "(3) 冷戰時期"] }
                    ]
                }
            ];
        };

        const RAW_DATA = generateRawData();
        const TOTAL_ITEMS = RAW_DATA.reduce((acc, sec) => acc + sec.items.length, 0) * 5; // 14單元 * 5次複習 = 70次進度

        // 輔助函式：確保取出的進度格式為長度 5 的陣列
        const getProgressArray = (progressData) => {
            if (Array.isArray(progressData)) return progressData;
            if (progressData === true) {
                const today = new Date().toISOString().split('T')[0];
                return [today, null, null, null, null];
            }
            return [null, null, null, null, null];
        };

        // ==========================================
        // 3. React Components
        // ==========================================

        const { useState, useEffect, useMemo } = React;

        const StatusLight = ({ status }) => {
            let dotClass = 'status-loading';
            let text = '☁️ 連線中...';

            if (status === 'success') {
                dotClass = 'status-success';
                text = '✅ 已同步雲端';
            } else if (status === 'error') {
                dotClass = 'status-error';
                text = '❌ 同步失敗';
            } else if (status === 'loading') {
                dotClass = 'status-loading';
                text = '⏳ 讀取資料中...';
            } else {
                dotClass = ''; 
                text = '📱 本機離線模式';
            }

            return (
                <div className="flex items-center text-sm font-bold text-gray-600 bg-white px-4 py-2 rounded-full border-2 border-gray-200 shadow-sm">
                    <span className={`status-dot ${dotClass}`}></span>
                    {text}
                </div>
            );
        };

        const App = () => {
            // UI States
            const [currentUser, setCurrentUser] = useState(null); 
            const [allUsers, setAllUsers] = useState([]);
            const [localProgress, setLocalProgress] = useState({}); 
            const [loginName, setLoginName] = useState("");
            const [showLogin, setShowLogin] = useState(false);
            
            // 複習日曆 Modal States
            const [reviewModal, setReviewModal] = useState(null);

            // System States
            const [isAuthReady, setIsAuthReady] = useState(false);
            const [syncStatus, setSyncStatus] = useState("loading"); 

            // 計算所有完成的複習次數總和
            const completedCount = useMemo(() => {
                let count = 0;
                Object.values(localProgress).forEach(progressData => {
                    const arr = getProgressArray(progressData);
                    count += arr.filter(date => date !== null).length;
                });
                return count;
            }, [localProgress]);

            // 1. Init Auth
            useEffect(() => {
                if (!firebaseConfig.apiKey) {
                    setSyncStatus("offline");
                    const saved = localStorage.getItem('Exam-History'); 
                    if (saved) setLocalProgress(JSON.parse(saved));
                    return;
                }

                const unsubscribeAuth = onAuthStateChanged(auth, (user) => {
                    if (user) {
                        setIsAuthReady(true);
                    } else {
                        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                        if (initialAuthToken) {
                            signInWithCustomToken(auth, initialAuthToken).catch(e => console.error("Token login failed", e));
                        } else {
                            signInAnonymously(auth).catch(e => console.error("Anon login failed", e));
                        }
                    }
                });

                return () => unsubscribeAuth();
            }, []);

            // 2. Fetch Users
            useEffect(() => {
                if (!isAuthReady || !db) return;

                setSyncStatus("loading");
                const unsubGlobal = onSnapshot(doc(db, COLLECTION_NAME, DOC_GLOBAL), (docSnap) => {
                    if (docSnap.exists()) {
                        setAllUsers(docSnap.data().users || []);
                    } else {
                        setDoc(doc(db, COLLECTION_NAME, DOC_GLOBAL), { users: [] }, { merge: true });
                        setAllUsers([]);
                    }
                    if (!currentUser) setSyncStatus("success");
                }, (error) => {
                    console.error("Fetch users error:", error);
                    setSyncStatus("error");
                });

                return () => unsubGlobal();
            }, [isAuthReady, currentUser]);

            // 3. Fetch User Progress
            useEffect(() => {
                if (!currentUser || !isAuthReady || !db) return;

                setSyncStatus('loading');
                const unsubUser = onSnapshot(doc(db, COLLECTION_NAME, currentUser), (docSnap) => {
                    if (docSnap.exists()) {
                        setLocalProgress(docSnap.data().progress || {});
                    } else {
                        setLocalProgress({});
                    }
                    setSyncStatus('success');
                }, (err) => {
                    console.error("Sync progress error:", err);
                    setSyncStatus('error');
                });

                return () => unsubUser();
            }, [currentUser, isAuthReady]);

            const handleLogin = async (name) => {
                if (!name.trim()) return;
                const uname = name.trim();
                
                if (isAuthReady && db) {
                    if (!allUsers.includes(uname)) {
                        try {
                            await updateDoc(doc(db, COLLECTION_NAME, DOC_GLOBAL), {
                                users: arrayUnion(uname)
                            });
                        } catch (e) {
                            await setDoc(doc(db, COLLECTION_NAME, DOC_GLOBAL), {
                                users: arrayUnion(uname)
                            }, { merge: true });
                        }
                    }
                }
                
                setCurrentUser(uname);
                setShowLogin(false);
                setLoginName("");
            };

            const saveReviewProgress = async (code, index, dateStr) => {
                const currentArr = [...getProgressArray(localProgress[code])];
                currentArr[index] = dateStr;
                
                const newProgress = { ...localProgress, [code]: currentArr };
                setLocalProgress(newProgress);

                if (currentUser && isAuthReady && db) {
                    try {
                        setSyncStatus('loading');
                        await setDoc(doc(db, COLLECTION_NAME, currentUser), {
                            progress: newProgress,
                            lastUpdated: new Date()
                        }, { merge: true });
                        setSyncStatus('success');
                    } catch (e) {
                        console.error("Save failed:", e);
                        setSyncStatus('error');
                    }
                } else {
                    localStorage.setItem('Exam-History', JSON.stringify(newProgress)); 
                }
                setReviewModal(null); 
            };

            const openReviewModal = (e, item, index) => {
                e.preventDefault();
                e.stopPropagation();
                const currentArr = getProgressArray(localProgress[item.code]);
                const existingDate = currentArr[index] || new Date().toISOString().split('T')[0]; 
                
                setReviewModal({
                    itemCode: item.code,
                    itemTitle: item.title,
                    color: item.color,
                    index: index,
                    date: existingDate,
                    isExisting: !!currentArr[index]
                });
            };

            return (
                <div className="max-w-[1300px] mx-auto relative">
                    
                    {/* Header */}
                    <div className="header mx-auto mt-6">
                        <h1 className="animate-bounce-in">🎒 歷史會考衝刺 🌟</h1>
                        <div className="flex flex-col items-center gap-5">
                            <p className="bg-white px-6 py-2 rounded-full border-4 border-[#ffeaa7] font-bold text-[#d35400] text-xl shadow-sm inline-block">
                                ✏️ 國中歷史・主題式素養探索 📚
                            </p>
                            
                            {!currentUser && allUsers.length > 0 && (
                                <div className="w-full max-w-2xl my-2 p-5 bg-white/70 backdrop-blur-md rounded-3xl border-4 border-pink-200 shadow-sm animate-bounce-in">
                                    <p className="text-center text-[#ff6b81] mb-4 font-black text-lg">
                                        👇 點擊你的名字快速登入 👇
                                    </p>
                                    <div className="flex flex-wrap justify-center gap-3">
                                        {allUsers.map(u => (
                                            <button 
                                                key={u} 
                                                onClick={() => handleLogin(u)} 
                                                className="quick-user-btn"
                                            >
                                                👧👦 {u}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="flex items-center justify-center flex-wrap gap-4 mt-2">
                                <div className="text-xl font-black text-white bg-gradient-to-r from-[#ff9a9e] to-[#fecfef] px-6 py-2 rounded-full shadow-[0_4px_0_#ffb8b8] border-2 border-white flex items-center gap-2">
                                    🏆 總複習進度：{completedCount} / {TOTAL_ITEMS}
                                </div>
                                <StatusLight status={syncStatus} />
                            </div>

                            <div className="mt-4 flex items-center justify-center gap-3">
                                {currentUser ? (
                                    <div className="flex items-center gap-3 animate-bounce-in bg-white px-6 py-3 rounded-full border-4 border-[#55efc4] shadow-sm">
                                        <span className="text-lg text-gray-500 font-bold">🚀 挑戰者：</span>
                                        <span className="font-black text-2xl text-[#00b894]">{currentUser}</span>
                                        <button 
                                            onClick={() => { setCurrentUser(null); setLocalProgress({}); }}
                                            className="bg-gray-100 hover:bg-gray-200 text-gray-600 px-4 py-1 rounded-full font-bold transition ml-2"
                                        >
                                            登出 👋
                                        </button>
                                    </div>
                                ) : (
                                    <button 
                                        onClick={() => setShowLogin(true)}
                                        className="text-xl bg-white border-4 border-[#74b9ff] text-[#0984e3] px-8 py-3 rounded-full hover:bg-[#e3f2fd] transition shadow-[0_6px_0_#74b9ff] hover:translate-y-1 hover:shadow-[0_2px_0_#74b9ff] font-black flex items-center gap-2"
                                    >
                                        👑 點我登入 / 紀錄進度
                                    </button>
                                )}
                            </div>
                        </div>
                        
                        <div className="mt-8">
                            <a href="https://nicktsai88.github.io/List/" className="home-btn">
                                🎁 返回快樂學習百寶箱
                            </a>
                        </div>
                    </div>

                    {/* Login Modal */}
                    {showLogin && (
                        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 backdrop-blur-sm" onClick={() => setShowLogin(false)}>
                            <div className="bg-white p-8 rounded-[30px] shadow-2xl w-full max-w-sm mx-4 animate-bounce-in flex flex-col items-center border-4 border-[#ffb8b8]" onClick={e => e.stopPropagation()}>
                                <div className="text-5xl mb-4">👋</div>
                                <h3 className="text-2xl font-black text-center mb-6 text-[#ff6b81]">建立新挑戰者</h3>
                                <div className="flex flex-col gap-4 w-full">
                                    <input 
                                        type="text" 
                                        value={loginName}
                                        onChange={(e) => setLoginName(e.target.value)}
                                        placeholder="輸入你的名字..." 
                                        className="w-full border-4 border-gray-200 rounded-2xl px-4 py-3 text-xl font-bold focus:outline-none focus:border-[#ff9a9e] text-center transition"
                                        onKeyDown={(e) => e.key === 'Enter' && handleLogin(loginName)}
                                    />
                                    <button 
                                        onClick={() => handleLogin(loginName)}
                                        className="w-full bg-[#ff9a9e] text-white py-3 rounded-2xl font-black text-xl shadow-[0_6px_0_#ff7675] hover:translate-y-1 hover:shadow-[0_2px_0_#ff7675] transition"
                                    >
                                        出發！🚀
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 日曆複習 Modal */}
                    {reviewModal && (
                        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 backdrop-blur-sm" onClick={() => setReviewModal(null)}>
                            <div className="bg-white p-8 rounded-[30px] shadow-2xl w-full max-w-sm mx-4 animate-bounce-in flex flex-col items-center border-4" style={{borderColor: reviewModal.color}} onClick={e => e.stopPropagation()}>
                                <div className="text-4xl mb-2">📅</div>
                                <h3 className="text-xl font-black text-gray-800 mb-2 text-center leading-tight">{reviewModal.itemTitle}</h3>
                                <p className="text-lg font-bold mb-6" style={{color: reviewModal.color}}>第 {reviewModal.index + 1} 次複習紀錄 ✨</p>
                                
                                <input 
                                    type="date" 
                                    value={reviewModal.date}
                                    onChange={(e) => setReviewModal({...reviewModal, date: e.target.value})}
                                    className="w-full border-4 rounded-2xl px-4 py-3 text-lg font-bold text-gray-700 focus:outline-none transition"
                                    style={{ borderColor: '#f1f2f6' }}
                                />
                                
                                <div className="flex flex-col gap-3 w-full mt-6">
                                    <button 
                                        onClick={() => saveReviewProgress(reviewModal.itemCode, reviewModal.index, reviewModal.date)}
                                        className="w-full text-white py-3 rounded-2xl font-black text-xl transition hover:brightness-110"
                                        style={{ 
                                            backgroundColor: reviewModal.color,
                                            boxShadow: `0 6px 0 ${reviewModal.color}99`
                                        }}
                                        onMouseDown={(e) => { e.currentTarget.style.transform = 'translateY(4px)'; e.currentTarget.style.boxShadow = `0 2px 0 ${reviewModal.color}99`; }}
                                        onMouseUp={(e) => { e.currentTarget.style.transform = ''; e.currentTarget.style.boxShadow = `0 6px 0 ${reviewModal.color}99`; }}
                                    >
                                        儲存 💖
                                    </button>
                                    
                                    {reviewModal.isExisting && (
                                        <button 
                                            onClick={() => saveReviewProgress(reviewModal.itemCode, reviewModal.index, null)}
                                            className="w-full bg-white text-red-500 border-4 border-red-100 py-3 rounded-2xl font-black text-lg hover:bg-red-50 transition mt-2"
                                        >
                                            清除紀錄 🗑️
                                        </button>
                                    )}

                                    <button 
                                        onClick={() => setReviewModal(null)}
                                        className="w-full text-gray-400 py-2 rounded-2xl font-bold hover:bg-gray-100 transition mt-1"
                                    >
                                        取消返回
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Content Grid */}
                    <div className="pb-20">
                        {RAW_DATA.map((section, idx) => (
                            <div key={idx} className="mb-16">
                                <div className="section-divider-container">
                                    <div className="section-divider-line"></div>
                                    <div className="section-divider">
                                        {section.icon} {section.title} {section.icon}
                                    </div>
                                </div>
                                
                                <div className="app-grid">
                                    {section.items.map((item) => {
                                        const progressArr = getProgressArray(localProgress[item.code]);
                                        const completedReviews = progressArr.filter(date => date !== null).length;
                                        const isAllDone = completedReviews === 5;

                                        return (
                                            <a 
                                                key={item.code}
                                                href={item.href}
                                                target="_blank"
                                                className={`app-card group`}
                                                style={{
                                                    border: `4px solid ${isAllDone ? item.color : '#fff'}`, 
                                                    boxShadow: isAllDone ? `0 8px 0 ${item.color}, 0 0 25px ${item.color}66` : `0 8px 0 ${item.lightColor}`,
                                                    transform: isAllDone ? 'scale(1.02)' : 'none'
                                                }}
                                            >
                                                <div 
                                                    className="card-icon-wrapper"
                                                    style={{ 
                                                        color: item.color, 
                                                        backgroundColor: item.lightColor,
                                                        borderColor: isAllDone ? item.color : '#fff'
                                                    }}
                                                >
                                                    {item.icon}
                                                </div>
                                                
                                                <div className="card-title" style={{ color: item.color }}>
                                                    {item.title} {isAllDone && "🏆"}
                                                </div>
                                                
                                                {/* 學習內容：上下排列清單 */}
                                                <div 
                                                    className="w-full mt-2 mb-5 text-left flex-grow font-bold text-gray-600 bg-gray-50 rounded-2xl p-4 border-2 border-dashed"
                                                    style={{ borderColor: item.lightColor }}
                                                >
                                                    <ul className="flex flex-col gap-2">
                                                        {item.contents.map((txt, i) => (
                                                            <li key={i} className="flex items-start gap-2 text-sm leading-snug">
                                                                <span style={{color: item.color, fontSize: '1.2em', lineHeight: '1'}}>✨</span>
                                                                <span>{txt}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                                
                                                {/* 5次複習區塊 */}
                                                <div className="w-full mt-auto">
                                                    <div className="text-sm font-black mb-3 flex items-center justify-center gap-1" style={{color: item.color}}>
                                                        🔥 複習進度 ({completedReviews}/5)
                                                    </div>
                                                    <div className="flex justify-between w-full gap-2">
                                                        {[0, 1, 2, 3, 4].map(revIdx => {
                                                            const dateVal = progressArr[revIdx];
                                                            const isChecked = !!dateVal;
                                                            // 格式化顯示 (若有日期則顯示 月/日，否則顯示數字)
                                                            const displayTxt = isChecked ? dateVal.substring(5).replace('-', '/') : (revIdx + 1);

                                                            return (
                                                                <div 
                                                                    key={revIdx}
                                                                    onClick={(e) => openReviewModal(e, item, revIdx)}
                                                                    className={`flex-1 py-2 rounded-xl flex items-center justify-center text-sm font-black cursor-pointer transition-all hover:-translate-y-1`}
                                                                    style={{ 
                                                                        backgroundColor: isChecked ? item.color : '#fff',
                                                                        color: isChecked ? 'white' : '#b2bec3',
                                                                        border: `2px solid ${isChecked ? item.color : '#dfe6e9'}`,
                                                                        boxShadow: isChecked ? `0 4px 0 ${item.color}88` : `0 4px 0 #dfe6e9`
                                                                    }}
                                                                    title={isChecked ? `完成於: ${dateVal}` : `第 ${revIdx + 1} 次複習`}
                                                                >
                                                                    {displayTxt}
                                                                </div>
                                                            )
                                                        })}
                                                    </div>
                                                </div>
                                            </a>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
